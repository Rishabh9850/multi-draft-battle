<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>Multi Draft Battle</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="The live auction card battle. Outbid your friends for legends from Marvel, Harry Potter, Mahabharat, Naruto, One Piece and Ben 10.">
<meta name="theme-color" content="#0b0d1f">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Bangers&family=Big+Shoulders+Display:wght@700;800;900&family=Cinzel:wght@600;700;900&family=IM+Fell+English+SC&family=Montserrat:wght@300;400;800;900&family=Orbitron:wght@600;800;900&family=Pirata+One&family=Shojumaru&family=Yatra+One&display=swap" rel="stylesheet">
<style>
/* =========================================================================
   TOKENS — no color-mix() anywhere (older iPad Safari can't render it)
   ========================================================================= */
:root{
  --vh:100vh;
  --bg:#0b0d1f;--bg2:#1b1f4a;--panel:#141838;--panel2:#1c2150;--panel-t:rgba(20,24,56,.86);--panel2-t:rgba(28,33,80,.9);
  --line:rgba(255,255,255,.13);--line2:rgba(255,255,255,.24);
  --text:#f6f7ff;--muted:#b3b8e0;--acc:#ff3d7f;--acc2:#29c5f6;--on-acc:#fff;--acc-s:rgba(255,61,127,.16);
  --cur:#ffd23f;--cur-ink:#2a1d00;--cur-s:rgba(255,210,63,.14);--cur-g:rgba(255,210,63,.45);
  --ok:#5be38a;--bad:#ff5a6a;--bad-s:rgba(255,90,106,.22);
  --disp:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;--body:'Archivo','Helvetica Neue',Arial,sans-serif;
  --dls:.01em;--dw:900;--r:18px;--glow:rgba(255,61,127,.38);--tbh:60px;
  color-scheme:dark;
}
@supports (height:100dvh){:root{--vh:100dvh}}
:root[data-deck=marvel]{--bg:#07080f;--bg2:#3a0a10;--panel:#11131f;--panel2:#1a1d2e;--panel-t:rgba(17,19,31,.88);--panel2-t:rgba(26,29,46,.92);--acc:#ed1d24;--acc2:#3d7bff;--acc-s:rgba(237,29,36,.18);--cur:#ffc928;--cur-s:rgba(255,201,40,.14);--cur-g:rgba(255,201,40,.45);--glow:rgba(237,29,36,.5);--disp:'Montserrat','Arial Black',sans-serif;--dls:-.01em;--dw:900}
:root[data-deck=naruto]{--bg:#110a06;--bg2:#3a1804;--panel:#1d130c;--panel2:#2a1c12;--panel-t:rgba(29,19,12,.88);--panel2-t:rgba(42,28,18,.92);--line:rgba(255,170,90,.2);--line2:rgba(255,170,90,.38);--text:#fff5ea;--muted:#e0c3a2;--acc:#ff7a00;--acc2:#3b87ff;--on-acc:#1a0b00;--acc-s:rgba(255,122,0,.18);--cur:#ffc94a;--cur-s:rgba(255,201,74,.14);--cur-g:rgba(255,201,74,.45);--glow:rgba(255,122,0,.5);--disp:'Shojumaru','Impact',serif;--dls:.02em;--dw:400}
:root[data-deck=onepiece]{--bg:#06172a;--bg2:#0e3b60;--panel:#0d2742;--panel2:#13365a;--panel-t:rgba(13,39,66,.88);--panel2-t:rgba(19,54,90,.92);--line:rgba(242,227,179,.18);--line2:rgba(242,227,179,.36);--text:#fff8e8;--muted:#c2d4e6;--acc:#e63b2e;--acc2:#f2c14e;--acc-s:rgba(230,59,46,.2);--cur:#f2c14e;--cur-s:rgba(242,193,78,.14);--cur-g:rgba(242,193,78,.45);--glow:rgba(242,193,78,.45);--disp:'Pirata One','Georgia',serif;--dls:.03em;--dw:400}
:root[data-deck=mahabharat]{--bg:#140409;--bg2:#4a0f12;--panel:#230a10;--panel2:#331118;--panel-t:rgba(35,10,16,.84);--panel2-t:rgba(51,17,24,.9);--line:rgba(217,165,58,.26);--line2:rgba(217,165,58,.5);--text:#fff4df;--muted:#e8cb9f;--acc:#ff8a1f;--acc2:#d9a53a;--on-acc:#2a0d00;--acc-s:rgba(255,138,31,.2);--cur:#f4c542;--cur-s:rgba(244,197,66,.14);--cur-g:rgba(244,197,66,.5);--glow:rgba(255,138,31,.5);--disp:'Cinzel','Georgia',serif;--dls:.04em;--dw:900}
:root[data-deck=ben10]{--bg:#030806;--bg2:#08281f;--panel:#0b1512;--panel2:#10211b;--panel-t:rgba(11,21,18,.88);--panel2-t:rgba(16,33,27,.92);--line:rgba(80,255,150,.18);--line2:rgba(80,255,150,.38);--text:#edfff4;--muted:#a6d6bc;--acc:#39e67a;--acc2:#b6ff5c;--on-acc:#03140a;--acc-s:rgba(57,230,122,.16);--cur:#b6ff5c;--cur-ink:#0d1a00;--cur-s:rgba(182,255,92,.12);--cur-g:rgba(182,255,92,.45);--glow:rgba(57,230,122,.5);--disp:'Orbitron','Arial',sans-serif;--dls:.04em;--dw:900}
:root[data-deck=harrypotter]{--bg:#06100f;--bg2:#0d2c28;--panel:#0f1716;--panel2:#172322;--panel-t:rgba(13,21,20,.84);--panel2-t:rgba(23,35,34,.9);--line:rgba(212,175,95,.22);--line2:rgba(212,175,95,.44);--text:#f8f1e1;--muted:#cdbf9e;--acc:#d4af5f;--acc2:#3fd2b4;--on-acc:#1d1404;--acc-s:rgba(212,175,95,.16);--cur:#e9c46a;--cur-s:rgba(233,196,106,.14);--cur-g:rgba(233,196,106,.45);--glow:rgba(63,210,180,.4);--disp:'IM Fell English SC','Georgia',serif;--dls:.02em;--dw:400}
:root[data-deck=custom]{--acc:#7c8cff;--acc-s:rgba(124,140,255,.18);--glow:rgba(124,140,255,.4)}

/* ================= BASE ================= */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.5 var(--body);overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:disabled{cursor:not-allowed}
a{color:inherit}
:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
h1,h2,h3{font-family:var(--disp);font-weight:var(--dw);letter-spacing:var(--dls);line-height:1.02;margin:0}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#deco{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;background:radial-gradient(ellipse 90% 60% at 50% -10%,var(--bg2),transparent 70%),var(--bg)}
#deco svg{position:absolute;inset:0}
#deco .ph{position:absolute;inset:0;background-position:center 35%;background-size:cover;background-repeat:no-repeat;opacity:.95}
#deco .ph::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.55) 40%,rgba(0,0,0,.8))}
#app{max-width:1440px;margin:0 auto;padding:8px 16px 32px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}

/* ================= BUTTONS (body font only, never wraps) ================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--line2);background:var(--panel2);border-radius:14px;padding:10px 16px;min-height:46px;font:700 15px/1.15 var(--body);letter-spacing:0;text-decoration:none;white-space:nowrap;transition:transform .12s,filter .12s,background .2s,border-color .2s}
.btn:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.12)}
.btn:active:not(:disabled){transform:translateY(1px) scale(.98)}
.btn:disabled{opacity:.38}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--on-acc);box-shadow:0 10px 30px -10px var(--glow)}
.btn.gold{background:var(--cur);border-color:var(--cur);color:var(--cur-ink)}
.btn.ghost{background:transparent}
.btn.big{min-height:56px;font-size:17px;padding:12px 24px}
.btn.wide{width:100%}
.btn.sm{min-height:38px;padding:7px 12px;font-size:13.5px;border-radius:11px}
.btn svg{width:19px;height:19px;flex:none}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:8px;font-size:14px}
.link:hover{color:var(--text)}.link svg{width:15px;height:15px;vertical-align:-3px}

/* ================= TOP BAR ================= */
.topbar{display:flex;align-items:center;gap:8px;min-height:52px;padding:4px 0 10px;flex-wrap:nowrap}
@media (max-width:1180px){.game{grid-template-columns:minmax(0,1fr) clamp(236px,24vw,350px)}}
.brand{font:900 21px/1 'Big Shoulders Display',Impact,sans-serif;letter-spacing:.01em;text-transform:uppercase;margin-right:auto;display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 0;white-space:nowrap;min-width:0}
.brand b{color:var(--cur)}.brand .bm{width:30px;height:30px;flex:none}
.tb{display:inline-flex;align-items:center;gap:7px;border:2px solid var(--line);background:var(--panel-t);border-radius:12px;padding:7px 12px;min-height:42px;font:700 14px/1 var(--body);white-space:nowrap;transition:border-color .2s,background .2s;flex:none}
.tb:hover{border-color:var(--line2);background:var(--panel2)}
.tb svg{width:18px;height:18px;flex:none}
.chipr{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:999px;padding:6px 12px;font:700 13px/1 var(--body);background:var(--panel-t);white-space:nowrap;flex:none}
.chipr i{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc)}
@media (max-width:1180px){.topbar.gm .tb span{display:none}.topbar.gm .tb{padding:7px 10px}}
@media (max-width:680px){.tb span{display:none}.tb{padding:7px 9px}.brand{font-size:18px}.brand .bnt{display:none}.topbar{gap:6px}.chipr .rw{display:none}.chipr{padding:6px 10px}}

/* ================= HOME ================= */
.hero{display:grid;justify-items:center;text-align:center;gap:16px;padding:6px 0 30px}
.fan{display:flex;justify-content:center;align-items:flex-end;height:clamp(92px,15vw,140px);margin-bottom:4px}
.fan .cback{width:clamp(60px,9.5vw,98px);margin:0 -10px;pointer-events:none;animation:floaty 5s ease-in-out infinite}
.fan .cback:nth-child(1){transform:rotate(-16deg) translateY(14px);animation-delay:-1s}
.fan .cback:nth-child(2){transform:rotate(-6deg) translateY(2px);animation-delay:-2s}
.fan .cback:nth-child(3){transform:rotate(6deg) translateY(2px);animation-delay:-3s}
.fan .cback:nth-child(4){transform:rotate(16deg) translateY(14px);animation-delay:-4s}
@keyframes floaty{50%{margin-top:-14px}}
.logo{display:grid;justify-items:center;line-height:.82;font-family:'Big Shoulders Display',Impact,sans-serif;font-weight:900;text-transform:uppercase;letter-spacing:0;margin:0}
.logo .l1{font-size:clamp(22px,4.4vw,44px);letter-spacing:.55em;padding-left:.55em;color:#fff;display:flex;align-items:center;gap:.4em}
.logo .l1::before,.logo .l1::after{content:'';width:clamp(26px,6vw,70px);height:4px;border-radius:4px;background:linear-gradient(90deg,#29c5f6,#ff3d7f)}
.logo .l2{font-size:clamp(84px,19vw,210px);color:#ffd23f;-webkit-text-stroke:.05em #0b0d1f;paint-order:stroke fill;text-shadow:.03em .04em 0 #ff3d7f,.06em .08em 0 rgba(0,0,0,.45);margin-top:.02em}
.logo .l3{font-size:clamp(30px,6.4vw,70px);letter-spacing:.32em;padding:.08em .4em .06em .72em;color:#fff;background:linear-gradient(90deg,#ff3d7f,#ff8a3d);border:.06em solid #0b0d1f;transform:skewX(-10deg);margin-top:.06em;box-shadow:.12em .12em 0 rgba(0,0,0,.4)}
.logo .l3 span{display:inline-block;transform:skewX(10deg)}
.tagline{max-width:40ch;margin:4px auto 0;font-size:clamp(16px,2.1vw,20px);color:var(--muted)}
.tagline b{color:var(--text)}
.feats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.feat{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:1px solid var(--line2);background:var(--panel-t);font-weight:600;font-size:14px}
.feat svg{width:18px;height:18px;color:var(--cur)}
.cta{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.resume{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;border:2px solid var(--cur);background:var(--cur-s);border-radius:16px;padding:10px 12px 10px 18px;font-weight:600}
.resume svg{width:22px;height:22px;color:var(--cur)}
.sect-h{text-align:center;margin:10px 0 18px}
.sect-h h2{font-size:clamp(34px,6vw,56px);text-transform:uppercase}
.sect-h p{margin:8px auto 0;color:var(--muted);max-width:52ch}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tile.t-custom{grid-column:1/-1;min-height:150px}
@media (max-width:980px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.tiles{grid-template-columns:1fr}}
.tile{position:relative;overflow:hidden;border-radius:22px;border:2px solid rgba(255,255,255,.14);min-height:240px;padding:0;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;background:#111;box-shadow:0 18px 40px -22px #000;transition:transform .2s,box-shadow .2s,border-color .2s;isolation:isolate;color:#fff}
.tile:hover,.tile:focus-visible{transform:translateY(-6px);box-shadow:0 28px 50px -20px var(--tgg,#000);border-color:var(--tg,#fff)}
.tile .t-art{position:absolute;inset:0;z-index:-1}
.tile .t-art svg{width:100%;height:100%;display:block}
.t-photo{position:absolute;inset:0;background-size:cover;background-position:center 40%;transition:transform .6s}
.tile:hover .t-photo{transform:scale(1.05)}
.tile .t-body{display:grid;gap:4px;padding:60px 18px 16px;background:linear-gradient(0deg,rgba(0,0,0,.92) 0,rgba(0,0,0,.72) 55%,transparent)}
.t-kick{font:800 12px/1.2 var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--tg)}
.t-title{font-size:44px;line-height:.95;color:#fff}
.t-sub{color:rgba(255,255,255,.8);font-size:14px}
.t-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.t-meta span{display:inline-flex;align-items:center;gap:6px;font:700 12px/1 var(--body);padding:6px 10px;border-radius:999px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.22);color:#fff;white-space:nowrap}
.t-meta svg{width:14px;height:14px}.t-meta .ci{width:15px;height:15px}
.t-play{position:absolute;top:14px;right:14px;font:800 13px/1 var(--body);padding:7px 12px;border-radius:999px;background:var(--tg);color:#111;opacity:0;transform:translateY(-6px);transition:.2s}
.tile:hover .t-play,.tile:focus-visible .t-play{opacity:1;transform:none}
.t-new{position:absolute;top:14px;left:14px;font:800 11px/1 var(--body);letter-spacing:.12em;padding:6px 10px;border-radius:999px;background:#fff;color:#111}
.t-marvel{--tg:#ed1d24;--tgg:rgba(237,29,36,.6)}.t-marvel .t-title{font:900 54px/.9 'Montserrat',sans-serif;letter-spacing:-.02em;text-transform:uppercase}.t-marvel .t-title::after{content:'';display:block;width:64px;height:5px;background:#ed1d24;margin-top:8px}
.t-naruto{--tg:#ff8a1f;--tgg:rgba(255,138,31,.6)}.t-naruto .t-title{font-family:'Shojumaru',serif;font-size:42px;color:#ff8a1f;text-shadow:3px 3px 0 #000}
.t-onepiece{--tg:#f2c14e;--tgg:rgba(242,193,78,.6)}.t-onepiece .t-title{font-family:'Pirata One',serif;font-size:54px;color:#f8e7b8;text-shadow:3px 3px 0 #5a1d0c}
.t-mahabharat{--tg:#ffb347;--tgg:rgba(255,138,31,.6)}.t-mahabharat .t-title{font-family:'Yatra One',serif;font-size:52px;color:#ffd06a;text-shadow:0 0 18px rgba(255,138,31,.7),2px 3px 0 #3d0b12;line-height:1.05}
.t-mahabharat .t-en{font:900 15px/1 'Cinzel',serif;letter-spacing:.24em;color:#ffcf8a}
.t-ben10{--tg:#39e67a;--tgg:rgba(57,230,122,.6)}.t-ben10 .t-title{font:900 40px/1 'Orbitron',sans-serif;color:#39e67a;text-shadow:0 0 18px rgba(57,230,122,.6)}
.t-harrypotter{--tg:#e9c46a;--tgg:rgba(63,210,180,.55)}.t-harrypotter .t-title{font-family:'IM Fell English SC',serif;font-size:50px;color:#f3dfa6;text-shadow:0 0 22px rgba(63,210,180,.55),2px 2px 0 #000}
.t-custom .t-art{left:auto;width:42%}.t-custom{--tg:#9aa6ff;--tgg:rgba(154,166,255,.5);border-style:dashed}.t-custom .t-title{font:900 46px/1 'Big Shoulders Display',sans-serif}
.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:34px}

/* ================= PANELS / SETUP ================= */
.wrap{max-width:900px;margin:0 auto;display:grid;gap:16px}
.banner{position:relative;overflow:hidden;border-radius:22px;border:2px solid var(--line2);min-height:210px;display:flex;align-items:flex-end;padding:20px 22px;isolation:isolate;background:linear-gradient(135deg,var(--bg2),var(--bg))}
.banner .t-art{position:absolute;top:0;bottom:0;right:0;width:62%;z-index:-1;-webkit-mask-image:linear-gradient(90deg,transparent,#000 40%);mask-image:linear-gradient(90deg,transparent,#000 40%)}.banner .t-art svg{width:100%;height:100%;display:block}
.banner::after{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,rgba(0,0,0,.65),transparent 65%)}
.banner h1{font-size:clamp(40px,8vw,72px);color:#fff;text-shadow:3px 3px 0 rgba(0,0,0,.5)}
.banner p{margin:6px 0 0;color:rgba(255,255,255,.88)}
@media (max-width:640px){.banner{min-height:170px}.banner .t-art{width:85%;opacity:.75}}
.box{background:linear-gradient(180deg,var(--panel-t),rgba(0,0,0,.35));border:1px solid var(--line2);border-radius:var(--r);padding:18px 20px;box-shadow:0 14px 40px -26px #000;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.box>h3{font-size:clamp(24px,3.6vw,30px);margin-bottom:6px;display:flex;align-items:center;gap:10px}
.box>h3 svg{width:24px;height:24px;color:var(--acc);flex:none}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:14px 0}
.row+.row{border-top:1px solid var(--line)}
.row .lbl{flex:1 1 240px;min-width:0}
.row .lbl b{display:block;font-weight:700}
.row .lbl small{display:block;color:var(--muted);font-size:13.5px;margin-top:2px}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.seg{display:inline-flex;flex-wrap:wrap;background:rgba(0,0,0,.35);border:1px solid var(--line2);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:10px;padding:9px 14px;font:700 14px/1.1 var(--body);color:var(--muted);min-height:40px;white-space:nowrap}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--acc);color:var(--on-acc);box-shadow:0 6px 18px -8px var(--glow)}
.np{display:inline-flex;align-items:center;gap:4px;background:rgba(0,0,0,.35);border:1px solid var(--line2);border-radius:14px;padding:4px;-webkit-user-select:none;user-select:none;touch-action:none}
.np button{width:40px;height:40px;border-radius:10px;border:0;background:var(--panel2);font:700 22px/1 var(--body)}
.np button:hover{background:var(--acc);color:var(--on-acc)}
.np output{min-width:76px;text-align:center;font:900 26px/1 'Big Shoulders Display',sans-serif;cursor:ns-resize;padding:0 4px}
.np output small{font:600 13px var(--body);color:var(--muted);margin-left:3px}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:6px}
.nm-in{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.35);border-radius:14px;padding:4px 6px;border:1px solid var(--line2)}
.nm-in:focus-within{border-color:var(--acc2)}
.nm-in input{flex:1;min-width:0;border:0;background:none;color:var(--text);font:600 17px var(--body);padding:10px 4px}
.nm-in input:focus{outline:none}
.av{width:32px;height:32px;flex:none;border-radius:10px;background:var(--pc,#888);color:#10142e;display:grid;place-items:center;font:800 13px/1 var(--body);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.av.lg{width:44px;height:44px;font-size:17px;border-radius:13px}
.toggle{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.toggle input{width:22px;height:22px;accent-color:var(--acc);flex:none;margin-top:2px}
.code{font:900 40px 'Big Shoulders Display',sans-serif;letter-spacing:.24em;color:var(--cur)}
.startbar{position:sticky;bottom:10px;z-index:5}
.startbar .btn{width:100%;min-height:64px;font:var(--dw) 21px/1.1 var(--disp);letter-spacing:var(--dls);text-transform:uppercase}

/* ================= CURRENCY ================= */
.cur{display:inline-flex;align-items:center;gap:.28em;font-weight:800;white-space:nowrap}
.ci{width:1.05em;height:1.05em;flex:none;display:inline-block;vertical-align:-.15em}

/* ================= CARD BACKS ================= */
.cback{position:relative;aspect-ratio:5/7;border-radius:16px;border:3px solid rgba(255,255,255,.92);overflow:hidden;padding:0;background:#222;box-shadow:0 18px 30px -16px #000;display:block}
.cback svg{position:absolute;inset:0;width:100%;height:100%}
.cback .qm{position:absolute;inset:0;display:grid;place-items:center;font:900 clamp(40px,8vw,80px)/1 'Big Shoulders Display',sans-serif;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.4)}

/* =========================================================================
   GAME LAYOUT — fits one screen on laptops / tablets (landscape)
   ========================================================================= */
.game{display:grid;grid-template-columns:minmax(0,1fr) clamp(270px,25vw,350px);gap:14px;align-items:stretch}
.stage{position:relative;background:linear-gradient(180deg,var(--panel-t),rgba(0,0,0,.45));border:1px solid var(--line2);border-radius:22px;padding:18px;min-width:0;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px -30px #000;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
@media (min-width:901px) and (min-height:560px){
  #app.fit{height:var(--vh);display:flex;flex-direction:column;padding-bottom:12px;overflow:hidden}
  #app.fit .game{flex:1 1 0;min-height:0}
  #app.fit .stage{min-height:0;overflow:auto}
  #app.fit .show{flex:1 1 0;min-height:150px;overflow:hidden}
  #app.fit .roster{height:100%;overflow:auto}
}
.turnh{display:flex;align-items:center;gap:14px}
.turnh h2{font-size:clamp(26px,4vw,46px)}
.turnh h2 em{font-style:normal;color:var(--pc)}
.turnh p{margin:4px 0 0;color:var(--muted)}
.backs{flex:1 1 auto;display:flex;justify-content:center;align-items:center;gap:clamp(10px,3vw,34px);padding:10px 0;min-height:0}
.backs .cback{width:calc(var(--cardH,280px)*.68);max-width:30%;cursor:pointer;transition:transform .2s,box-shadow .2s;animation:deal .55s cubic-bezier(.2,.9,.3,1.2) backwards}
.backs .cback:nth-child(1){transform:rotate(-4deg)}.backs .cback:nth-child(2){transform:translateY(-8px);animation-delay:.08s}.backs .cback:nth-child(3){transform:rotate(5deg);animation-delay:.16s}
.backs .cback:hover,.backs .cback:focus-visible{transform:translateY(-16px) scale(1.04);box-shadow:0 26px 40px -14px var(--glow)}
@keyframes deal{from{opacity:0;transform:translateY(-80px) rotate(-20deg) scale(.7)}}
.hint{text-align:center;color:var(--muted);margin:0;font-size:15px}
.exs{display:flex;gap:6px;flex-wrap:wrap}
.ex{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--panel2-t);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:700}
.ex i{width:9px;height:9px;border-radius:50%;background:var(--pc)}
.ex.done{border-color:var(--ok)}

/* ---------- roster (always shows names of owned cards) ---------- */
.roster{display:grid;gap:10px;align-content:start}
.roster>h3{font-size:22px;padding:0 4px;display:flex;justify-content:space-between;align-items:baseline}
.roster>h3 small{font:600 13px var(--body);color:var(--muted)}
.pcard{background:var(--panel-t);border:1px solid var(--line2);border-left:6px solid var(--pc);border-radius:16px;padding:10px 12px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.pcard.now{box-shadow:0 0 0 2px var(--pc),0 10px 30px -12px var(--pcg)}
.pcard.lead{background:linear-gradient(90deg,var(--pcs),var(--panel-t))}
.pcard.out{opacity:.5}
.pcard .hd{display:flex;align-items:center;gap:10px}
.pcard .nmx{flex:1;min-width:0}
.pcard .nmx b{display:block;font-size:16px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .nmx small{color:var(--muted);font-size:12px;font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pcard .bal{font:900 24px/1 'Big Shoulders Display',sans-serif;color:var(--cur);display:flex;align-items:center;gap:4px}
.pcard .bal .ci{width:18px;height:18px}
.badge{font:800 10.5px/1 var(--body);letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:4px 8px;background:var(--panel2);border:1px solid var(--line2);white-space:nowrap}
.badge.go{background:var(--pc);border-color:var(--pc);color:#10142e}
.badge.bad{background:var(--bad);border-color:var(--bad);color:#200}
.badge.okb{background:var(--ok);border-color:var(--ok);color:#03200d}
.tl{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px}
.tl li{display:flex;align-items:center;gap:8px;font-size:13px;line-height:1.2;min-width:0}
.tl li .th{width:20px;flex:none;border-radius:4px;overflow:hidden}
.tl li span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl li span i{font-style:normal;color:var(--muted)}
.tl li.emp{color:var(--muted);font-size:12px}
.tl li.emp .th{height:28px;border:1.5px dashed var(--line2)}
.tl li.emp.req .th{border-color:var(--muted)}
@media (max-width:900px),(max-height:559px){
  .game{display:flex;flex-direction:column}.game>*{min-width:0;max-width:100%}
  .roster{order:-1;display:flex;overflow-x:auto;gap:8px;padding:2px 2px 6px;-webkit-overflow-scrolling:touch;scroll-snap-type:x mandatory}
  .roster>h3{display:none}
  .pcard{min-width:190px;max-width:230px;flex:none;scroll-snap-align:start;padding:8px 10px}
  .pcard .bal{font-size:20px}
  .tl li{font-size:12px}.tl li .th{width:16px}.tl li.emp{display:none}
}
@media (max-width:640px){.stage{padding:14px;border-radius:18px}}

/* =========================================================================
   CARD
   ========================================================================= */
.cx{position:relative;aspect-ratio:5/7;width:100%;border-radius:18px;overflow:hidden;isolation:isolate;background:#111;container-type:inline-size}
.cx-bg{position:absolute;inset:0;z-index:0;background:radial-gradient(circle at 50% 40%,var(--cc1),var(--cc2) 72%)}
.cx-bg::before{content:'';position:absolute;inset:-40%;background:repeating-conic-gradient(rgba(255,255,255,.09) 0 7deg,transparent 7deg 18deg);animation:spin 60s linear infinite}
.cx-fx{position:absolute;inset:0;z-index:1;pointer-events:none}
.cx-fx svg{width:100%;height:100%;display:block;overflow:visible}
.cx-fig{position:absolute;inset:0;z-index:2;display:grid;place-items:center}
.cx-fig img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.cx-fig .emb{width:62%;color:#fff;filter:drop-shadow(0 6px 0 rgba(0,0,0,.3)) drop-shadow(0 0 22px var(--fxc))}
.cx-fig .emb svg{width:100%;height:auto;display:block}
.cx-fig .mono{position:absolute;bottom:22%;font:900 30px/1 'Big Shoulders Display',sans-serif;font-size:13cqw;color:rgba(255,255,255,.2)}
.cx-frame{position:absolute;inset:0;z-index:3;pointer-events:none;border-radius:inherit}
.cx-rar{position:absolute;z-index:4;top:6%;left:6%;font:800 10px/1 var(--body);font-size:max(9px,4.6cqw);letter-spacing:.08em;text-transform:uppercase;padding:.45em .8em;border-radius:999px;background:var(--rc);color:#10142e;box-shadow:0 0 14px -2px var(--rc)}
.cx-name{position:absolute;z-index:4;left:5%;right:5%;bottom:4.5%;display:grid;gap:2px;text-align:center;padding:.6em .5em;border-radius:12px;background:rgba(8,10,24,.86);border:1px solid rgba(255,255,255,.2)}
.cx-name b{font:var(--dw) 18px/1.02 var(--disp);font-size:max(10px,8.4cqw);letter-spacing:var(--dls);text-transform:uppercase;color:#fff;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cx-name i{font-style:normal;font-size:11px;font-size:max(9px,4.6cqw);color:rgba(255,255,255,.78);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cx.mini{border-radius:inherit}
.cx.mini .cx-bg::before{display:none}
.cx.mini .cx-fig .emb{width:70%;filter:none}
.cx.mini .cx-fig .mono,.cx.mini .cx-orn,.cx.mini .cx-wanted{display:none}
.cx.rar-legendary{box-shadow:0 0 0 3px var(--rc),0 0 40px -6px var(--rc)}
.cx.rar-epic{box-shadow:0 0 0 3px var(--rc),0 0 30px -8px var(--rc)}
.cx.rar-rare{box-shadow:0 0 0 2px var(--rc)}
.cx.mini.rar-legendary,.cx.mini.rar-epic,.cx.mini.rar-rare{box-shadow:none}
.cx:not(.mini) .cx-frame{box-shadow:inset 0 0 0 3px rgba(255,255,255,.85)}
.cx.flip{animation:flipin .6s cubic-bezier(.2,.8,.2,1.15)}
@keyframes flipin{from{transform:perspective(900px) rotateY(95deg) scale(.85);opacity:.2}}
.cx.tilt{transform:perspective(800px) rotateY(var(--ry,0deg)) rotateX(var(--rx,0deg));transition:transform .15s ease-out}
.cx-orn{position:absolute;z-index:4;width:20%;color:#f4c542;pointer-events:none}
.cx-orn svg{width:100%;height:auto;display:block}
.cx-orn.tl{top:2.5%;left:2.5%}.cx-orn.tr{top:2.5%;right:2.5%;transform:scaleX(-1)}

/* marvel: cinematic dark + halftone */
[data-deck=marvel] .cx-bg{background:radial-gradient(rgba(0,0,0,.3) 1.3px,transparent 1.7px) 0 0/8px 8px,radial-gradient(circle at 50% 36%,var(--cc1),var(--cc2) 74%)}
[data-deck=marvel] .cx:not(.mini) .cx-frame{box-shadow:inset 0 0 0 3px #0b0b10,inset 0 0 0 6px var(--cc)}
[data-deck=marvel] .cx-name{background:linear-gradient(180deg,rgba(10,10,16,.6),rgba(10,10,16,.95));border:0;border-top:3px solid var(--cc);border-radius:6px}
[data-deck=marvel] .cx-name b{font-family:'Montserrat',sans-serif;font-weight:900;letter-spacing:-.01em}
/* naruto */
[data-deck=naruto] .cx-bg{background:radial-gradient(circle at 50% 36%,#ffb066 0,var(--cc1) 34%,#1a0a02 80%)}
[data-deck=naruto] .cx:not(.mini) .cx-frame{box-shadow:inset 0 0 0 3px #1a0a02,inset 0 0 0 6px #ff7a00,inset 0 0 0 8px #1a0a02}
[data-deck=naruto] .cx-name{background:linear-gradient(180deg,#f6e4c3,#e3c592);border:0;border-radius:4px;box-shadow:0 -2px 0 #8a4a14 inset,0 2px 0 #8a4a14 inset}
[data-deck=naruto] .cx-name b{color:#2a1406}[data-deck=naruto] .cx-name i{color:#6b3a12}
/* one piece: wanted poster */
[data-deck=onepiece] .cx-bg{background:radial-gradient(circle at 50% 30%,#f7ebc8,#e6cf96 60%,#c9a866)}
[data-deck=onepiece] .cx-bg::before{display:none}
[data-deck=onepiece] .cx:not(.mini) .cx-fig{inset:20% 9% 26%;border:3px solid #3a2410;background:radial-gradient(circle at 50% 40%,var(--cc1),var(--cc2));overflow:hidden}
[data-deck=onepiece] .cx:not(.mini) .cx-fx{inset:20% 9% 26%;overflow:hidden}
[data-deck=onepiece] .cx:not(.mini) .cx-frame{box-shadow:inset 0 0 0 2px #7a5528,inset 0 0 30px rgba(90,50,10,.55)}
[data-deck=onepiece] .cx-wanted{position:absolute;z-index:4;top:4%;left:0;right:0;text-align:center;font:400 30px/1 'Pirata One',serif;font-size:15cqw;color:#3a2410;letter-spacing:.04em}
[data-deck=onepiece] .cx-rar{top:auto;bottom:27%;left:50%;transform:translate(-50%,50%)}
[data-deck=onepiece] .cx-name{background:none;border:0;bottom:3%}
[data-deck=onepiece] .cx-name b{color:#3a2410;font-family:'Pirata One',serif;font-size:max(14px,10cqw)}
[data-deck=onepiece] .cx-name i{color:#5a3a18}
[data-deck=onepiece] .cx-bounty{font:400 16px/1 'Pirata One',serif;font-size:max(12px,8cqw);color:#3a2410;display:flex;align-items:center;justify-content:center;gap:4px}
/* mahabharat */
[data-deck=mahabharat] .cx-bg{background:radial-gradient(circle at 50% 36%,#ffd27a 0,var(--cc1) 32%,#3d0b12 78%)}
[data-deck=mahabharat] .cx:not(.mini) .cx-frame{box-shadow:inset 0 0 0 3px #2a0508,inset 0 0 0 6px #d9a53a,inset 0 0 0 8px #2a0508,inset 0 0 0 10px #f4c542}
[data-deck=mahabharat] .cx-name{background:linear-gradient(180deg,#5a1018,#2a0508);border:2px solid #d9a53a;border-radius:10px}
[data-deck=mahabharat] .cx-name b{color:#ffd27a;font-family:'Cinzel',serif;font-weight:900;font-size:max(11px,7.6cqw)}
[data-deck=mahabharat] .cx-rar{left:50%;transform:translateX(-50%);top:4.5%}
/* ben 10 */
[data-deck=ben10] .cx-bg{background:linear-gradient(60deg,rgba(57,230,122,.12) 1px,transparent 1px) 0 0/14px 24px,linear-gradient(-60deg,rgba(57,230,122,.12) 1px,transparent 1px) 0 0/14px 24px,radial-gradient(circle at 50% 38%,var(--cc1),#020604 76%)}
[data-deck=ben10] .cx:not(.mini) .cx-frame{box-shadow:inset 0 0 0 2px #39e67a,inset 0 0 26px rgba(57,230,122,.35)}
[data-deck=ben10] .cx-name{background:rgba(2,10,6,.88);border:1px solid #39e67a;border-radius:4px}
[data-deck=ben10] .cx-name b{color:#b6ff5c;font-size:max(10px,7cqw)}
/* harry potter: candle-lit, house colours, gilded frame */
[data-deck=harrypotter] .cx-bg{background:radial-gradient(circle at 50% 34%,var(--cc1) 0,var(--cc2) 52%,#05080a 86%)}
[data-deck=harrypotter] .cx-bg::before{background:radial-gradient(circle,rgba(255,240,200,.5) 0 1px,transparent 1.6px) 0 0/22px 26px;animation:drift2 18s linear infinite;inset:-10%}
@keyframes drift2{to{transform:translateY(-26px)}}
[data-deck=harrypotter] .cx:not(.mini) .cx-frame{box-shadow:inset 0 0 0 2px #2b1d0b,inset 0 0 0 5px #c9a253,inset 0 0 0 7px #2b1d0b,inset 0 0 40px rgba(0,0,0,.6)}
[data-deck=harrypotter] .cx-name{background:linear-gradient(180deg,var(--hs1),var(--hs2));border:2px solid #c9a253;border-radius:8px}
[data-deck=harrypotter] .cx-name b{font-family:'IM Fell English SC',serif;font-weight:400;color:#fbeec8;font-size:max(12px,8.6cqw);text-transform:none}
[data-deck=harrypotter] .cx-name i{color:rgba(251,238,200,.85)}
[data-deck=harrypotter] .cx-rar{left:50%;transform:translateX(-50%);top:5%}

/* =========================================================================
   SHOWCASE (revealed card) — character-profile layout
   ========================================================================= */
.show{display:flex;gap:22px;align-items:stretch}
.cardcol{flex:none;width:calc(var(--cardH,300px)*5/7)}
.cinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;overflow:auto;padding-right:4px}
.cinfo .by{color:var(--muted);font-size:13.5px;display:flex;align-items:center;gap:8px}
.cinfo .by .av{width:24px;height:24px;font-size:10px;border-radius:7px}
.cname{font-family:var(--disp);font-weight:var(--dw);letter-spacing:var(--dls);line-height:.95;text-transform:uppercase;font-size:clamp(30px,4.4vw,58px);margin:2px 0 0;color:var(--text)}
[data-deck=marvel] .cname b{font-weight:900}[data-deck=marvel] .cname span{font-weight:300}
.cname span{opacity:.92}
.cname-bar{width:72px;height:4px;border-radius:4px;background:var(--cc);box-shadow:0 0 18px var(--cc)}
.cinfo .form{font:700 15px/1.3 var(--body);color:var(--acc)}
.pline{display:flex;gap:10px;align-items:flex-start;background:var(--acc-s);border:1px solid var(--line2);border-radius:12px;padding:8px 12px;font-size:14.5px;line-height:1.35}
.pline svg{width:20px;height:20px;flex:none;color:var(--cur);margin-top:1px}
.pline b{color:var(--cur)}
.cinfo p.d{margin:0;font-size:15px;line-height:1.45;max-width:60ch}
.wand{font-size:13.5px;color:var(--muted)}.wand b{color:var(--text)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:5px 18px;max-width:560px;margin-top:2px}
.st{display:grid;grid-template-columns:minmax(78px,auto) 1fr 26px;gap:8px;align-items:center;font:700 12px/1.1 var(--body);color:var(--muted)}
.st u{height:8px;border-radius:8px;background:var(--line);overflow:hidden;display:block;text-decoration:none}
.st u i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));border-radius:8px;animation:grow .9s cubic-bezier(.2,.8,.2,1) backwards}
.st b{color:var(--text);font-size:13px;text-align:right}
.st.best span{color:var(--cur)}
@keyframes grow{from{width:0!important}}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font:700 12px/1 var(--body);border-radius:999px;padding:5px 10px;background:var(--panel2);border:1px solid var(--line2);white-space:nowrap}
.tag.pow{background:var(--rc);color:#10142e;border-color:var(--rc)}
.tag.vil{background:var(--bad-s);border-color:var(--bad)}
@media (max-width:900px),(max-height:559px){
  .show{gap:14px}
  .cardcol{width:min(40vw,230px)}
  .stats{grid-template-columns:1fr}
}
@media (max-width:560px){
  .show{display:grid;grid-template-columns:34vw minmax(0,1fr);gap:4px 12px;align-items:start}
  .show .cinfo{display:contents}
  .show .cardcol{grid-row:1 / span 6;width:auto}
  .show .cinfo>p.d,.show .cinfo>.stats,.show .cinfo>.tags{grid-column:1 / -1}
  .show .cname-bar{display:none}
  .stats{grid-template-columns:1fr 1fr;gap:4px 12px}
  .cardcol{width:38vw}
  .cname{font-size:26px}
  .cinfo p.d{font-size:13.5px}
  .pline{font-size:13px;padding:6px 9px}
  .st{grid-template-columns:56px 1fr 22px;font-size:10.5px;gap:5px}
  .cinfo .by{font-size:12px}.cinfo .form{font-size:13px}
}

/* =========================================================================
   AUCTION — one tile per player with quick bid buttons
   ========================================================================= */
.auct{display:grid;gap:10px;border-top:2px dashed var(--line2);padding-top:12px;flex:none}
.leadrow{display:flex;gap:10px;align-items:stretch}
.leadbox{flex:1;min-width:0;display:flex;align-items:center;gap:14px;border-radius:16px;padding:8px 14px;background:linear-gradient(90deg,var(--pcs),var(--panel2-t));border:2px solid var(--pc);box-shadow:0 10px 30px -14px var(--pcg)}
.leadbox .who{flex:1;min-width:0}
.leadbox .who small{display:block;font:800 11px/1.2 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.leadbox .who b{display:block;font:900 30px/1.05 'Big Shoulders Display',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leadbox .amt{display:flex;align-items:center;gap:8px;font:900 58px/.9 'Big Shoulders Display',sans-serif;color:var(--cur);text-shadow:0 0 30px var(--cur-g)}
.leadbox .amt .ci{width:.6em;height:.6em}
.bump{animation:bump .3s ease}@keyframes bump{40%{transform:scale(1.05)}}
.tmbox{flex:none;width:118px;border-radius:16px;border:2px solid var(--line2);background:var(--panel2-t);display:grid;place-items:center;align-content:center;gap:4px;padding:6px;position:relative;overflow:hidden}
.tmbox b{font:900 40px/1 'Big Shoulders Display',sans-serif}
.tmbox small{font:800 10px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tmbox i{position:absolute;left:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--acc2),var(--cur));width:100%}
.tmbox.hot{border-color:var(--bad);animation:pulse .5s ease-in-out infinite alternate}.tmbox.hot b{color:var(--bad)}.tmbox.hot i{background:var(--bad)}
@keyframes pulse{to{box-shadow:0 0 0 4px var(--bad-s)}}
.bts{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px}
.bt{border:2px solid var(--line2);background:var(--panel2-t);border-radius:14px;padding:8px;display:grid;gap:7px;min-width:0;transition:border-color .15s}
.bt:hover{border-color:var(--pc)}
.bt-h{display:flex;align-items:center;gap:8px;min-width:0}
.bt-h .av{width:28px;height:28px;font-size:11.5px;border-radius:8px}
.bt-h .tx{flex:1;min-width:0}
.bt-h b{display:block;font-size:15px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt-h small{display:block;font-size:11.5px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt-b{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:5px}
.bt-b button{border:0;border-radius:10px;min-height:40px;background:rgba(255,255,255,.08);font:800 15px/1 var(--body);display:grid;place-items:center;padding:4px 2px;white-space:nowrap}
.bt-b button small{display:block;font-size:10px;font-weight:700;opacity:.8;margin-top:2px}

.gvb{border:2px solid var(--pc);background:var(--panel2-t);border-radius:14px;padding:10px;display:flex;align-items:center;gap:8px;min-height:54px;text-align:left;font-weight:700}

.gv-to{font-weight:800;font-size:18px}
.shk{animation:shk .45s}@keyframes shk{20%{transform:translate(-8px,4px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-5px,-3px)}80%{transform:translate(4px,3px)}}
#brv{position:fixed;inset:0;z-index:45;display:grid;place-content:center;justify-items:center;gap:12px;background:rgba(3,4,14,.88);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);text-align:center;padding:20px;animation:fadein .25s}
#brv.out{animation:brvOut .3s ease forwards}@keyframes brvOut{to{opacity:0;transform:scale(.85)}}
#brv .cx{width:min(64vw,270px,38vh)}

/* ================= END / BOARD ================= */
.endh{text-align:center;display:grid;gap:8px;margin:6px 0 18px}

.rcard.out{opacity:.6}
.rcard .hd{display:flex;align-items:center;gap:10px}
.rcard .hd b{flex:1;font:var(--dw) 24px/1 var(--disp);letter-spacing:var(--dls)}
.rteam{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}

.rlist{margin:0;padding:0;list-style:none;font-size:14px;display:grid;gap:3px}

.bchips span.bad{background:var(--bad-s);border-color:var(--bad)}
.rank-pick .bts{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.placed{display:flex;gap:6px;flex-wrap:wrap}
.placed span{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;background:var(--panel2);border:2px solid var(--pc);font-weight:700;font-size:14px}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{text-align:left;color:var(--muted);font:800 12px var(--body);letter-spacing:.08em;text-transform:uppercase;padding:8px;border-bottom:2px solid var(--line2);white-space:nowrap}

.tbl td.n{font-weight:700}
.tbl td.big{font:900 22px/1 'Big Shoulders Display',sans-serif;color:var(--cur)}
.tbl tr.me td{background:var(--cur-s)}
.medal{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;font-weight:800;font-size:13px;background:var(--panel2)}
.medal.m1{background:#ffd23f;color:#2a1d00}.medal.m2{background:#cfd6e6;color:#1a1e2a}.medal.m3{background:#e0975a;color:#2a1200}
.tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.stepc{background:var(--panel-t);border:1px solid var(--line2);border-radius:18px;padding:16px;display:grid;gap:8px;align-content:start}

.stepc p{margin:0;color:var(--muted);font-size:14.5px}
.stepc p b{color:var(--text)}
.champ{text-align:center;display:grid;gap:6px;justify-items:center;padding:8px 0}
.champ svg{width:60px;height:60px;color:var(--cur)}

.lbwrap{overflow-x:auto}
.empty{text-align:center;color:var(--muted);padding:24px 8px}
.pool{display:grid;gap:6px;max-height:52vh;overflow:auto}

.q{width:100%;border:1px solid var(--line2);background:rgba(0,0,0,.35);color:var(--text);border-radius:12px;padding:11px 12px;font:600 16px var(--body)}
textarea.q{font-weight:500;line-height:1.5}

.ctl{max-width:560px;margin:0 auto;display:grid;gap:12px}
.mebar{display:flex;align-items:center;gap:12px;background:var(--panel-t);border:2px solid var(--pc);border-radius:18px;padding:10px 14px;position:sticky;top:6px;z-index:8;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}

/* sound popover */
#sndp{position:fixed;z-index:70;right:16px;top:64px;width:min(320px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line2);border-radius:18px;padding:16px;display:grid;gap:12px;box-shadow:0 24px 60px -20px #000;animation:pop .2s}
#sndp .srow{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center}
#sndp .srow b{font-size:15px}
#sndp input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--acc)}
.sw{position:relative;width:48px;height:28px;border-radius:99px;border:0;background:var(--line2);justify-self:end;transition:background .2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--acc)}.sw.on::after{transform:translateX(20px)}
.fr{position:fixed;z-index:60;pointer-events:none;width:var(--s);height:var(--s);border-radius:2px;background:var(--c);animation:fallc var(--t) linear both}
@keyframes fallc{from{opacity:0}5%{opacity:1}to{transform:translate(var(--dx),105vh) rotate(720deg)}}
.fp{position:fixed;z-index:60;pointer-events:none;width:var(--s);height:var(--s);border-radius:2px;background:var(--c);animation:flyp .9s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes flyp{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.2);opacity:0}}

/* ================= CARD FX ================= */
.fxs{color:var(--fxc)}
.fx-zap{fill:none;stroke:#fff;stroke-width:3;stroke-linejoin:round;filter:drop-shadow(0 0 5px var(--fxc)) drop-shadow(0 0 12px var(--fxc));opacity:0;animation:zap 2.6s infinite}
@keyframes zap{0%,100%{opacity:0}2%{opacity:1}4%{opacity:.15}6%{opacity:1}14%{opacity:0}}
.fx-flash{fill:var(--fxc);opacity:0;animation:flash 2.6s infinite}
@keyframes flash{0%,100%{opacity:0}2%{opacity:.35}8%{opacity:0}}
.fx-spin{transform-origin:100px 118px;animation:spin 14s linear infinite}
.fx-spinr{transform-origin:100px 118px;animation:spin 20s linear infinite reverse}
.fx-spinf{transform-origin:100px 118px;animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fx-ring{fill:none;stroke:var(--fxc);opacity:0;transform-origin:100px 140px;animation:ring 2.4s ease-out infinite}
@keyframes ring{0%{opacity:.9;transform:scale(.2)}100%{opacity:0;transform:scale(1.6)}}
.fx-glow{fill:var(--fxc);opacity:.35;animation:breathe 2.4s ease-in-out infinite;transform-origin:100px 140px}
@keyframes breathe{50%{opacity:.6;transform:scale(1.08)}}
.fx-rise{animation:rise var(--d,2.4s) linear infinite;animation-delay:var(--dl,0s);opacity:0}
@keyframes rise{0%{opacity:0;transform:translateY(0) scale(1)}15%{opacity:1}100%{opacity:0;transform:translateY(-230px) scale(.3)}}
.fx-fall{animation:fall var(--d,4s) linear infinite;animation-delay:var(--dl,0s);opacity:0}
@keyframes fall{0%{opacity:0;transform:translate(0,-30px) rotate(0)}10%{opacity:1}100%{opacity:0;transform:translate(var(--dx,20px),300px) rotate(var(--rt,360deg))}}
.fx-tw{animation:tw var(--d,2s) ease-in-out infinite;animation-delay:var(--dl,0s)}
@keyframes tw{0%,100%{opacity:.1}50%{opacity:1}}
.fx-draw{stroke-dasharray:var(--len,300);stroke-dashoffset:var(--len,300);animation:draw var(--d,2.2s) ease-out infinite;animation-delay:var(--dl,0s)}
@keyframes draw{0%{stroke-dashoffset:var(--len,300);opacity:1}45%{stroke-dashoffset:0;opacity:1}85%,100%{stroke-dashoffset:0;opacity:0}}
.fx-fly{animation:fly var(--d,1.6s) cubic-bezier(.4,0,.6,1) infinite;animation-delay:var(--dl,0s);opacity:0}
@keyframes fly{0%{opacity:0;transform:translate(-120px,120px)}15%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translate(260px,-200px)}}
.fx-slide{animation:slide var(--d,3s) linear infinite;animation-delay:var(--dl,0s)}
@keyframes slide{from{transform:translateX(-60px)}to{transform:translateX(60px)}}
.fx-streak{animation:streak var(--d,1.2s) linear infinite;animation-delay:var(--dl,0s);opacity:0}
@keyframes streak{0%{opacity:0;transform:translateX(-220px)}20%{opacity:.9}100%{opacity:0;transform:translateX(220px)}}
.fx-blob{animation:blob var(--d,2.2s) ease-in-out infinite;animation-delay:var(--dl,0s);transform-origin:var(--ox) var(--oy)}
@keyframes blob{50%{transform:scale(1.35)}}
.fx-drift{animation:drift var(--d,5s) ease-in-out infinite;animation-delay:var(--dl,0s);opacity:0}
@keyframes drift{0%{opacity:0;transform:translate(0,0) scale(.6)}30%{opacity:.8}100%{opacity:0;transform:translate(var(--dx,30px),-160px) scale(1.6)}}
.fx-tumble{animation:tumble var(--d,2.8s) cubic-bezier(.3,0,.7,1) infinite;animation-delay:var(--dl,0s);opacity:0;transform-origin:center;transform-box:fill-box}
@keyframes tumble{0%{opacity:0;transform:translateY(-80px) rotate(0)}15%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translateY(260px) rotate(540deg)}}
.fx-scan{animation:scan 2.6s linear infinite}@keyframes scan{from{transform:translateY(-20px)}to{transform:translateY(290px)}}
.fx-wisp{animation:wisp var(--d,3s) ease-in-out infinite;animation-delay:var(--dl,0s);opacity:0}
@keyframes wisp{0%{opacity:0;transform:translate(0,40px) scale(.7)}35%{opacity:.85}100%{opacity:0;transform:translate(var(--dx,0px),-200px) scale(1.4)}}
.cx.shake .cx-fig{animation:fshake 2.4s infinite}
@keyframes fshake{0%,8%,100%{transform:none}1%{transform:translate(-3px,2px)}3%{transform:translate(3px,-2px)}5%{transform:translate(-2px,-1px)}}
.d-spin{animation:spin 160s linear infinite;transform-origin:center;transform-box:fill-box}
/* Reduced motion is ONLY the in-game toggle, so every device looks the same */
:root[data-rm="1"] *,:root[data-rm="1"] *::before,:root[data-rm="1"] *::after{animation:none!important;transition:none!important}
</style>

const buildMarvel=()=>{const a=[];DATA.RAW.split(';').forEach(g=>{const[b,f]=g.split(':');(f?f.split(','):['']).forEach(x=>a.push({n:b,f:x,d:''}))});return a};
function parseLines(t){const seen=new Set(),a=[];String(t||'').split('\n').forEach(l=>{const[n,...d]=l.split('|'),nm=(n||'').trim();if(nm&&!seen.has(nm.toLowerCase())){seen.add(nm.toLowerCase());a.push({n:nm,f:'',d:d.join('|').trim()})}});return a}
const parseHP=t=>String(t).split('\n').filter(l=>l.trim()).map(l=>{const[n,f,w,h,d]=l.split('|');return{n:n.trim(),f:(f||'').trim(),w:(w||'').trim(),h:(h||'-').trim(),d:(d||'').trim()}});

function bond(ids){const n=ids.length;if(n<2)return{s:0,l:'—',c:[],x:[]};const cfg=BOND[DECK]||{vil:new Set(),pairs:[]};const B=ids.map(i=>DB[i].n),cnt={},fr=[];let tot=0,pairs=0;
  B.forEach(b=>tagsOf(b).forEach(t=>cnt[t]=(cnt[t]||0)+1));
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const a=B[i],b=B[j],ta=tagsOf(a),tb=tagsOf(b),sh=ta.filter(t=>tb.includes(t)).length;let s=Math.min(2,sh)*12;
    if(a==b)s+=10;const pr=cfg.pairs.find(([x,y])=>x==a&&y==b||x==b&&y==a);if(pr){s+=pr[2];if(pr[2]<0)fr.push(a+' vs '+b)}
    const va=cfg.vil.has(a),vb=cfg.vil.has(b);if(va!=vb&&!sh){s-=14;fr.push(a+' vs '+b)}else if(va&&vb)s+=4;tot+=s;pairs++}
  const sc=clamp(Math.round(30+tot/pairs*2),0,100);
  return{s:sc,l:BL.find(x=>sc>=x[0])[1],c:Object.entries(cnt).filter(e=>e[1]>1).sort((a,b)=>b[1]-a[1]).slice(0,4).map(e=>e[1]+'× '+e[0]),x:[...new Set(fr)].slice(0,2)}}

   To use your own music: put audio/<deck>.mp3 in the GitHub repo

let ACX=null,MG=null,SG=null,RVB=null;
function mkImpulse(a,sec=2.4,decay=2.6){const len=a.sampleRate*sec|0,b=a.createBuffer(2,len,a.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay)}return b}
function buildGraph(a){const comp=a.createDynamicsCompressor();comp.threshold.value=-14;comp.knee.value=10;comp.ratio.value=4;comp.attack.value=.005;comp.release.value=.22;comp.connect(a.destination);
 const mg=a.createGain(),sg=a.createGain(),cv=a.createConvolver(),rg=a.createGain(),sw=a.createGain();cv.buffer=mkImpulse(a);rg.gain.value=1;sw.gain.value=.18;
 mg.connect(comp);sg.connect(comp);sg.connect(sw);sw.connect(cv);cv.connect(rg);rg.connect(comp);return{mg,sg,rv:cv}}
function AC(){if(!ACX){ACX=new(window.AudioContext||window.webkitAudioContext)();const g=buildGraph(ACX);MG=g.mg;SG=g.sg;RVB=g.rv;MG.gain.value=0}return ACX}
function mkBus(a,dest,rv,wet){const g=a.createGain();g.connect(dest);if(rv){const w=a.createGain();w.gain.value=wet;g.connect(w);w.connect(rv)}
 const p=v=>{if(a.createStereoPanner){const s=a.createStereoPanner();s.pan.value=v;s.connect(g);return s}return g};return{g,c:g,l:p(-.45),r:p(.45)}}
const NZ=new WeakMap();
function nzb(a){let b=NZ.get(a);if(!b){b=a.createBuffer(1,a.sampleRate,a.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;NZ.set(a,b)}return b}
const mf=m=>440*Math.pow(2,(m-69)/12);
function osc(out,t,f,d,o={}){const a=out.context,os=a.createOscillator(),g=a.createGain();os.type=o.type||'triangle';
 if(o.glide){os.frequency.setValueAtTime(f*(o.glide===1||o.glide===true?.94:o.glide),t);os.frequency.linearRampToValueAtTime(f,t+(o.gt||.09))}else if(o.drop){os.frequency.setValueAtTime(f*1.03,t);os.frequency.exponentialRampToValueAtTime(f,t+.04)}else os.frequency.setValueAtTime(f,t);
 if(o.det)os.detune.value=o.det;let node=os;
 if(o.cut){const fl=a.createBiquadFilter();fl.type=o.ft||'lowpass';fl.frequency.setValueAtTime(o.cut,t);if(o.cut2)fl.frequency.exponentialRampToValueAtTime(o.cut2,t+(o.ct||d));fl.Q.value=o.q||.7;os.connect(fl);node=fl}
 if(o.vib){const l=a.createOscillator(),lg=a.createGain();l.frequency.value=o.vibr||5.5;lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(o.vib,t+(o.vd||.2));l.connect(lg);lg.connect(os.frequency);l.start(t);l.stop(t+d+.3)}
 const v=o.v??.1,at=o.a??.005;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+at);
 if(o.sus){g.gain.setValueAtTime(v,t+Math.max(at,d*.75));g.gain.linearRampToValueAtTime(.0001,t+d+(o.rel||.05))}else g.gain.exponentialRampToValueAtTime(.0001,t+Math.max(at+.02,d));

const N=(out,t,m,d,o)=>osc(out,t,mf(m),d,o);
function noise(out,t,v,type,f,d,q=.7,f2){const a=out.context,s=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain();s.buffer=nzb(a);fl.type=type;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+d);fl.Q.value=q;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl);fl.connect(g);g.connect(out);s.start(t,Math.random()*.5);s.stop(t+d+.02)}
function swell(out,t,v,f1,f2,d){const a=out.context,s=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain();s.buffer=nzb(a);s.loop=true;fl.type='bandpass';fl.Q.value=1.4;fl.frequency.setValueAtTime(f1,t);fl.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+d*.95);g.gain.linearRampToValueAtTime(.0001,t+d+.05);s.connect(fl);fl.connect(g);g.connect(out);s.start(t);s.stop(t+d+.1)}
function kick(out,t,v=.5,f0=130,f1=42,d=.28,type='sine'){const a=out.context,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d*.6);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(out);o.start(t);o.stop(t+d+.03);noise(out,t,v*.18,'highpass',3000,.012)}

const snare=(o,t,v=.14)=>{noise(o,t,v,'bandpass',1900,.17,.7);noise(o,t,v*.5,'highpass',5000,.08);osc(o,t,185,.09,{type:'triangle',v:v*.6})};

const block=(o,t,v=.08)=>{osc(o,t,1100,.06,{type:'sine',v});osc(o,t,1650,.04,{type:'sine',v:v*.5})};

const timp=(o,t,f=73,v=.32,d=1.1)=>{const a=o.context,os=a.createOscillator(),g=a.createGain();os.type='sine';os.frequency.setValueAtTime(f*1.12,t);os.frequency.exponentialRampToValueAtTime(f,t+.12);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);os.connect(g);g.connect(o);os.start(t);os.stop(t+d+.05);noise(o,t,v*.25,'lowpass',600,.12)};

const tabla=(o,t,v=.07,f=720)=>{const a=o.context,os=a.createOscillator(),g=a.createGain();os.type='sine';os.frequency.setValueAtTime(f,t);os.frequency.exponentialRampToValueAtTime(f*.92,t+.2);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.3);os.connect(g);g.connect(o);os.start(t);os.stop(t+.32)};

function brass(o,t,m,d,v=.05){const a=o.context,f=a.createBiquadFilter(),g=a.createGain();f.type='lowpass';f.Q.value=1.3;f.frequency.setValueAtTime(380,t);f.frequency.linearRampToValueAtTime(2800,t+.07);f.frequency.exponentialRampToValueAtTime(1400,t+.4);
 g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.04);g.gain.setValueAtTime(v*.85,t+Math.max(.06,d-.06));g.gain.linearRampToValueAtTime(.0001,t+d+.08);
 [-8,8].forEach(dt=>{const s=a.createOscillator();s.type='sawtooth';s.frequency.value=mf(m);s.detune.value=dt;s.connect(f);s.start(t);s.stop(t+d+.12)});f.connect(g);g.connect(o)}
function pad(o,t,ms,d,v=.016,cut=1500){ms.forEach(m=>{N(o,t,m,d,{type:'sawtooth',v,a:.35,sus:1,rel:.5,cut,det:-9});N(o,t,m,d,{type:'sawtooth',v,a:.35,sus:1,rel:.5,cut,det:9})})}

 else{const c=G.pick,b=G.bid;s=showcase(c,{by:p,bounty:b.a,keep:1,flip:fx.flip});

/* ---------------- rules ---------------- */
const need=i=>Math.max(0,G.min-G.teams[i].length);
function maxBid(i){if(G.elim[i])return 0;let r=G.coins[i];if(G.guard&&G.phase=='draft')r-=Math.max(0,G.min-(G.teams[i].length+1));return Math.max(0,r)}
function canBid(i){if(G.elim[i]||G.coins[i]<1)return false;if(G.phase=='draft')return G.teams[i].length<G.max&&maxBid(i)>=1;return !G.exDone[i]}
const canEx=i=>!G.elim[i]&&G.coins[i]>=1&&!G.exDone[i];
const exElig=()=>G.names.map((_,i)=>i).filter(canEx);
const NP=()=>G.names.length;
function nextFrom(from){for(let k=1;k<=NP();k++){const i=((from+G.dir*k)%NP()+NP())%NP();if(canBid(i))return i}return -1}
function order(from){const o=[];for(let k=0;k<NP();k++)o.push(((from+G.dir*k)%NP()+NP())%NP());return o}
const pool=()=>{const u=new Set(G.used);return DB.map((_,i)=>i).filter(i=>!u.has(i))};
function deal(){const u=pool(),c=[];while(c.length<3&&u.length)c.push(u.splice(Math.random()*u.length|0,1)[0]);G.cards=c;G.pick=null;G.bid=null;G.stage='pick';if(!c.length)endGame()}
function checkElim(){G.names.forEach((_,i)=>{if(!G.elim[i]&&G.teams[i].length<G.min&&G.coins[i]<need(i)){G.elim[i]=true;G.log.push({t:'out',p:i})}})}
function snap(){const c={...G};delete c.hist;G.hist=(G.hist||[]).slice(-19).concat(JSON.stringify(c))}
function undo(){if(!G.hist||!G.hist.length)return toast('Nothing to undo yet');const h=G.hist,prev=JSON.parse(h.pop());G=Object.assign(prev,{hist:h,menu:0});R();toast('Last result undone')}

 fx.flip=1;bigReveal(c);R();SX.play('flip')}
function bigReveal(c){if(RM)return;const o=document.createElement('div');o.id='brv';o.innerHTML=`${card(c,{flip:1})}<h2>${esc(DB[c].n)}</h2><div class=muted>${esc(DB[c].f||DK().kick)} · <b style="color:${tier(c)[2]}">${tier(c)[0]}</b></div><small class=muted>Tap to continue</small>`;
 const end=()=>{if(!o.isConnected)return;o.classList.add('out');setTimeout(()=>{o.remove();tmSync()},300)};o.onclick=end;document.body.appendChild(o);setTimeout(end,1600)}
function raise(i,n){const b=G.bid;if(!b||G.stage!='bid'||b.auto)return false;if(i===b.p){toast(G.names[i]+' is already leading');return false}if(!canBid(i)){toast(why(i));return false}
 const a=b.a+n;if(a>maxBid(i)){toast(G.names[i]+' can bid at most '+maxBid(i));return false}setBid(i,a);return true}

function bidUndo(){const b=G.bid;if(!b||!b.h||b.h.length<2)return;b.h.pop();const l=b.h[b.h.length-1];b.p=l.p;b.a=l.a;b.started=b.h.length>1?1:0;tmReset();R()}
function award(quiet){if(!G.bid||G.stage!='bid')return;const{p,a}=G.bid;if(!canBid(p)||a<1||a>maxBid(p))return toast('That bid is not allowed');

 G.coins[p]-=a;G.teams[p].push(G.pick);G.used.push(G.pick);G.log.push({t:'win',p,c:G.pick,a,ph:G.phase});G.last={p,c:G.pick,a,t:Date.now()};if(G.phase=='exchange')G.exDone[p]=true;

function doSwap(j){const{p,a}=G.bid,out=G.teams[p][j];G.used=G.used.filter(x=>x!==out);G.teams[p][j]=G.pick;G.used.push(G.pick);G.coins[p]-=a;G.exDone[p]=true;G.log.push({t:'swap',p,c:G.pick,out,a});G.last={p,c:G.pick,a,t:Date.now()};toast(G.names[p]+' swapped in '+DB[G.pick].n);after()}

const jLeft=()=>PUB&&PUB.l?Math.max(0,PUB.l-(performance.now()-PUB.at)/1000):0;
setInterval(()=>{if(G.screen!='join'||!PUB||!PUB.l)return;const L=jLeft(),e=$('#jt'),i=$('#jti'),b=$('#jtbox');if(e)e.textContent=Math.ceil(L)+'s';if(i)i.style.width=clamp(L/(PUB.lt||L||1)*100,0,100)+'%';if(b)b.classList.toggle('hot',L<=5)},100);
V.join=()=>{const tb=topbar(`<button class=tb onclick="G={screen:'home',saved:G.saved};PUB=null;ME=null;R()">${ic('home')}<span>Leave</span></button>`);
 if(NET===false)return tb+`<div class=ctl><div class=box><h3>Online needs the hosted link</h3><p class=muted>Open the game from its web address (not a downloaded file), then tap Join.</p></div></div>`;
 if(!PUB)return tb+`<div class=ctl><div class=box style="display:grid;gap:14px"><h3>${ic('phone')} Join a game</h3><p class=muted style="margin:0">Type the 4-letter room code shown on the host's screen.</p><input class=codein id=jc maxlength=4 placeholder="CODE" value="${esc(CODE)}" autocapitalize=characters autocomplete=off onkeydown="if(event.key=='Enter')joinTry()"><button class="btn primary big wide" onclick="joinTry()">Join</button>${JOINAT?`<p class=muted style="text-align:center;margin:0">${Date.now()-JOINAT>6000?'No reply yet. Check that the host turned on <b>Online</b> and the code matches.':'Looking for room '+esc(CODE)+'…'}</p>`:''}</div></div>`;
 const P=PUB;if(ME==null||ME>=P.n.length)return tb+`<div class=ctl><div class=box style="display:grid;gap:12px"><h3>Who are you?</h3><div class=ptiles>${P.n.map((n,i)=>`<button class=ptile style="${pcv(i)}" onclick="pickSeat(${i})">${av(i,0,P.n)}<span class=tx><b>${esc(n)}</b><small>${seat(i)}</small></span></button>`).join('')}</div></div></div>`;
 const m=ME,D=DK(),tmc=P.tm?P.tm[m]||[]:[];
 const me=`<div class=mebar style="${pcv(m)}">${av(m,1,P.n)}<b>${esc(P.n[m])}</b>${P.co?`<span class=bal>${coin()}${P.co[m]}</span>`:''}</div>`;
 const PP=P.tm?{n:P.n,tm:P.tm,co:P.co,el:P.el||[],min:P.mn||0,max:P.mxx||5}:null;
 const myTeam=PP?`<div class=jteam style="${pcv(m)}"><h4><span>Your team · ${tmc.length}/${PP.max}</span><span>${PP.min>tmc.length?`${PP.min-tmc.length} more needed`:'Minimum reached ✓'}</span></h4><ul class=tl>${tmc.map(c=>DB[c]?`<li><span class=th>${card(c,{mini:1})}</span><span><b>${esc(DB[c].n)}</b>${DB[c].f?` <i>· ${esc(DB[c].f)}</i>`:''} <i>· ${tier(c)[0]}</i></span></li>`:'').join('')||'<li class=emp>No cards yet</li>'}</ul></div>`:'';
 const allTeams=PP?`<details class=jteam><summary style="cursor:pointer;font-weight:700">Everyone's teams</summary><div class=teamsg style="margin-top:8px">${P.n.map((_,i)=>pcardHTML(PP,i,{you:i===m})).join('')}</div></details>`:'';
 let body='',over='';
 if(P.sc=='setup')body=`<div class=box><h3>You're in!</h3><p class=muted style="margin:0">Waiting for the host to start the game…</p></div>`;
 else if(P.sc=='end')body=`<div class=box><h3>Round over</h3><p class=muted style="margin:0">Look at the host screen to rank the teams.</p></div>`;
 else if(P.st=='pick')body=P.t==m?`<div class=box style="display:grid;gap:10px;text-align:center"><h3 style="justify-content:center">Your pick!</h3><p class=muted style="margin:0">Tap one mystery card.</p><div class=backs style="padding:10px 0">${Array.from({length:P.v},(_,k)=>`<button class=cback style="width:30%" onclick="NET.emit('pick',{c:CODE,p:ME,k:${k}})">${backSVG(DECK)}<span class=qm>?</span></button>`).join('')}</div></div>`:`<div class=box><h3>${esc(P.n[P.t])} is picking…</h3><p class=muted style="margin:0">Get ready to bid.</p></div>`;
 else if(P.st=='bid'&&P.cd>=0&&P.b&&DB[P.cd]){const b=P.b,cid=P.cd,lead=b.p===m,mx=P.mx[m],ok=P.ok[m],d=DB[cid];
  const btn=(r,cls)=>`<button class="btn ${cls}" ${!ok||lead||b.a+r>mx?'disabled':''} onclick="jbid(${r})">${r==1?(lead?'You lead':`Bid ${b.a+1}`):`+${r} → ${b.a+r}`}</button>`;
  body=`<div class=jcard>${card(cid,{keep:1,bounty:b.a})}<div><h3>${esc(d.n)}</h3><div class=muted style="font-size:13px">${esc(d.f||D.kick)} · ${tier(cid)[0]} · Power ${power(cid)}</div><div class=pline>${ic('star')}<span>${esc(powTxt(cid))}</span></div></div></div>
  ${desc(cid)?`<p class=muted style="margin:0;font-size:14px">${esc(desc(cid))}</p>`:''}
  <div class=leadrow><div class=leadbox style="${pcv(b.p)}">${av(b.p,1,P.n)}<div class=who><small>${lead?'You are leading!':'Highest bid'}</small><b>${esc(P.n[b.p])}</b></div><div class=amt>${coin()}${b.a}</div></div>${P.l?`<div class=tmbox id=jtbox><small>Auto-sell</small><b id=jt>${Math.ceil(jLeft())}s</b><i id=jti style="width:${clamp(jLeft()/(P.lt||1)*100,0,100)}%"></i></div>`:''}</div>
  ${b.au?`<p class=muted style="text-align:center">Default award. The host will confirm.</p>`:`<div class=jbid>${btn(1,'gold big')}<div class=row2>${btn(2,'')}${btn(5,'')}</div><p class=muted style="text-align:center;margin:0;font-size:13px">${ok?`You can bid up to ${mx} · ${P.co[m]} ${esc(D.cur)} left`:'You can\'t bid on this card'}</p></div>`}`;
  if(P.g&&P.gk<3){const can=ok&&!lead&&b.a+1<=mx;over=`<div class=jgv style="${pcv(b.p)}"><div class=gv-cap>${esc(d.n)} · going to ${esc(P.n[b.p])}</div><div class=gvn>${D.nums[P.gk]||''}</div><div class=gv-call>${esc(D.calls[P.gk]||'')}</div><div class=gv-lead style="${pcv(b.p)}">${av(b.p,1,P.n)}<div class=who><small>Leading bid</small><b>${esc(P.n[b.p])}</b></div><div class=amt>${coin()}${b.a}</div></div>${can?`<button class="btn gold big" style="min-height:84px;font:900 30px/1 'Big Shoulders Display',sans-serif" onclick="jbid(1)">BID ${b.a+1} — STOP IT!</button>`:lead?'<b style="font-size:20px">Hold on… it\'s nearly yours!</b>':''}</div>`}}
 else body=`<div class=box><h3>Waiting for the host…</h3></div>`;
 if(P.ls&&P.ls.c!=null&&DB[P.ls.c]&&P.ls.t===LASTSEEN&&Date.now()-(window.LSAT||0)<3500&&!(P.g&&P.gk<3)){const L=P.ls,mine=L.p===m;over=`<div class=jgv style="${pcv(L.p)}" onclick="PUB.ls=0;R()"><div class=gv-cap>${mine?'Yours!':'Sold'}</div><div style="width:min(46vw,200px)">${card(L.c,{fx:false})}</div><div class="stamp s-${['marvel','naruto','onepiece','mahabharat','ben10','harrypotter'].includes(DECK)?DECK:'default'}" style="font-size:min(15vh,18vw)">${esc(D.sold)}</div><b style="font-size:20px">${esc(P.n[L.p])} · ${money(L.a)}</b><small class=muted>Tap to close</small></div>`}
 return tb+`<div class=ctl>${me}${body}${myTeam}${allTeams}<button class=link onclick="ME=null;R()">Not me? Change seat</button></div>${over}`};

/* ---------------- sound panel ---------------- */
function sndIcon(){const b=$('#sndb');if(b)b.innerHTML=ic(MU.on||SX.on?'vol':'mute')+'<span>Sound</span>'}
function sndOpen(e){e&&e.stopPropagation();let p=$('#sndp');if(p){p.remove();return}p=document.createElement('div');p.id='sndp';p.setAttribute('role','dialog');p.setAttribute('aria-label','Sound');
 const draw=()=>{p.innerHTML=`<div class=srow><b>Music</b><button class="sw ${MU.on?'on':''}" aria-pressed="${MU.on}" aria-label="Music on or off" id=swm></button><input type=range min=0 max=1 step=.05 value="${MU.vol}" aria-label="Music volume" id=rvm></div>
  <div class=srow><b>Sound effects</b><button class="sw ${SX.on?'on':''}" aria-pressed="${SX.on}" aria-label="Sound effects on or off" id=sws></button><input type=range min=0 max=1 step=.05 value="${SX.vol}" aria-label="Effects volume" id=rvs></div>
  <small class=muted>Every universe has its own theme music.</small>`;
  p.querySelector('#swm').onclick=()=>{if(MU.on){MU.stop();LS.set('mdb-music',false)}else{MU.ctx(ctxDeck());MU.start();LS.set('mdb-music',true)}draw();sndIcon()};
  p.querySelector('#sws').onclick=()=>{SX.toggle();draw();sndIcon();SX.play('coin')};
  p.querySelector('#rvm').oninput=ev=>{MU.setVol(+ev.target.value);if(!MU.on){MU.ctx(ctxDeck());MU.start();LS.set('mdb-music',true);draw()}};
  p.querySelector('#rvs').onchange=ev=>{SX.setVol(+ev.target.value);SX.play('coin')}};
 draw();document.body.appendChild(p);const r=$('#sndb').getBoundingClientRect();p.style.top=(r.bottom+8)+'px';p.style.right=Math.max(12,innerWidth-r.right)+'px'}
document.addEventListener('click',e=>{const p=$('#sndp');if(p&&!p.contains(e.target)&&!e.target.closest('#sndb'))p.remove()});
document.addEventListener('keydown',e=>{if(e.key=='Escape'){const p=$('#sndp');if(p)p.remove();if(G.menu||G.pv||G.lb||G.cb){G.menu=G.pv=G.lb=G.cb=0;R()}}});

/* ---------------- navigation ---------------- */
function goHome(){if(G.screen=='game'||G.screen=='end'){if(!confirm('Leave this game? You can continue it later from the home screen.'))return;G={screen:'home',saved:{...G,menu:0,pv:0,lb:0,cb:0}}}else G={screen:'home',saved:G.saved||null};R();scrollTo(0,0)}
function resume(){const s=G.saved;if(!s)return;G=s;G.saved=null;setDeck(G.deck,G.customRaw);R();if(G.online)netHost()}

/* ---------------- boot ---------------- */
R();
if(REJOIN)netJoin().then(()=>{CODE=REJOIN.c;ME=REJOIN.me!=null?REJOIN.me:null;G={screen:'join',saved:G.saved||null};R();NET&&NET.room(CODE).then(()=>NET.emit('hello',{c:CODE,p:ME})).catch(()=>{})});
</script></body></html>
