<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>Multi Draft Battle</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="The live auction card battle. Outbid your friends for legends from Marvel, Naruto, One Piece, Mahabharat and Ben 10.">
<meta name="theme-color" content="#0b0d1f">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Bangers&family=Big+Shoulders+Display:wght@700;800;900&family=Cinzel:wght@600;700;900&family=Orbitron:wght@600;800;900&family=Pirata+One&family=Shojumaru&family=Yatra+One&display=swap" rel="stylesheet">
<style>
/* ================= TOKENS ================= */
:root{
  --bg:#0b0d1f;--bg2:#161a3d;--panel:#141838;--panel2:#1c2150;--line:rgba(255,255,255,.12);--line2:rgba(255,255,255,.22);
  --text:#f4f5ff;--muted:#a6abd6;--acc:#ff3d7f;--acc2:#29c5f6;--on-acc:#fff;--cur:#ffd23f;--cur-ink:#2a1d00;
  --ok:#5be38a;--bad:#ff5a6a;
  --disp:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;--body:'Archivo','Helvetica Neue',Arial,sans-serif;
  --dls:.01em;--dw:900;--r:18px;--glow:rgba(255,61,127,.35);
  color-scheme:dark;
}
:root[data-deck=marvel]{--bg:#0a0c1c;--bg2:#2a070c;--panel:#12152e;--panel2:#1b2045;--acc:#e62429;--acc2:#2b6fff;--cur:#ffd400;--glow:rgba(230,36,41,.45);--disp:'Bangers','Impact',sans-serif;--dls:.045em;--dw:400}
:root[data-deck=naruto]{--bg:#110a06;--bg2:#2c1404;--panel:#1b120c;--panel2:#281b12;--line:rgba(255,170,90,.18);--line2:rgba(255,170,90,.34);--text:#fff4e8;--muted:#d6b998;--acc:#ff7a00;--acc2:#2f7bff;--on-acc:#1a0b00;--cur:#ffc94a;--glow:rgba(255,122,0,.45);--disp:'Shojumaru','Impact',serif;--dls:.02em;--dw:400}
:root[data-deck=onepiece]{--bg:#06172a;--bg2:#0c3150;--panel:#0d2742;--panel2:#13365a;--line:rgba(242,227,179,.16);--line2:rgba(242,227,179,.32);--text:#fff8e8;--muted:#b9cde0;--acc:#e63b2e;--acc2:#f2c14e;--cur:#f2c14e;--glow:rgba(242,193,78,.4);--disp:'Pirata One','Georgia',serif;--dls:.03em;--dw:400}
:root[data-deck=mahabharat]{--bg:#16050a;--bg2:#3d0b12;--panel:#230a10;--panel2:#331118;--line:rgba(217,165,58,.24);--line2:rgba(217,165,58,.45);--text:#fff3dd;--muted:#dfc196;--acc:#ff8a1f;--acc2:#d9a53a;--on-acc:#2a0d00;--cur:#f4c542;--glow:rgba(255,138,31,.45);--disp:'Cinzel','Georgia',serif;--dls:.04em;--dw:900}
:root[data-deck=ben10]{--bg:#040807;--bg2:#08201a;--panel:#0b1512;--panel2:#10211b;--line:rgba(80,255,150,.16);--line2:rgba(80,255,150,.34);--text:#ecfff3;--muted:#9fcdb4;--acc:#39e67a;--acc2:#b6ff5c;--on-acc:#03140a;--cur:#b6ff5c;--glow:rgba(57,230,122,.45);--disp:'Orbitron','Arial',sans-serif;--dls:.04em;--dw:900}
:root[data-deck=custom]{--acc:#7c8cff;--acc2:#29c5f6;--glow:rgba(124,140,255,.4)}

/* ================= BASE ================= */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(ellipse 90% 60% at 50% -10%,var(--bg2),transparent 70%),var(--bg);background-attachment:fixed;color:var(--text);font:16px/1.5 var(--body);overflow-x:hidden;transition:background-color .4s}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:not-allowed}
a{color:inherit}
:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
h1,h2,h3{font-family:var(--disp);font-weight:var(--dw);letter-spacing:var(--dls);line-height:1;margin:0}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#deco{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
#deco svg{position:absolute}
#app{max-width:1320px;margin:0 auto;padding:12px 16px 40px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}

/* ================= BUTTONS ================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--line2);background:var(--panel2);border-radius:14px;padding:12px 18px;min-height:48px;font-weight:700;font-size:16px;text-decoration:none;transition:transform .12s,filter .12s,background .2s,border-color .2s}
.btn:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.12)}
.btn:active:not(:disabled){transform:translateY(1px) scale(.98)}
.btn:disabled{opacity:.4}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--on-acc);box-shadow:0 10px 30px -10px var(--glow)}
.btn.gold{background:var(--cur);border-color:var(--cur);color:var(--cur-ink)}
.btn.ghost{background:transparent}
.btn.big{min-height:58px;font-size:18px;padding:14px 26px}
.btn.wide{width:100%}
.btn.sm{min-height:40px;padding:8px 14px;font-size:14px;border-radius:12px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:8px;font-size:14px}
.link:hover{color:var(--text)}

/* ================= TOP BAR ================= */
.topbar{display:flex;align-items:center;gap:10px;padding:6px 0 14px;flex-wrap:wrap}
.brand{font-family:var(--disp);font-weight:var(--dw);letter-spacing:var(--dls);font-size:22px;line-height:1;text-transform:uppercase;margin-right:auto;display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 0}
.brand b{color:var(--cur)}
.brand .bm{width:30px;height:30px;flex:none}
.tb{display:inline-flex;align-items:center;gap:7px;border:2px solid var(--line);background:color-mix(in srgb,var(--panel) 85%,transparent);border-radius:12px;padding:7px 12px;min-height:42px;font-weight:700;font-size:14px;white-space:nowrap;transition:border-color .2s,background .2s}
.tb:hover{border-color:var(--line2);background:var(--panel2)}
.tb svg{width:18px;height:18px;flex:none}
.tb.hot{background:var(--cur);border-color:var(--cur);color:var(--cur-ink)}
.chipr{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;background:var(--panel);white-space:nowrap}
.chipr i{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc)}
@media (max-width:1100px){.gm .tb span{display:none}.gm .tb{padding:7px 10px}}
@media (max-width:640px){.tb span{display:none}.tb{padding:7px 9px}.brand{font-size:18px}.brand .bt{display:none}.topbar{flex-wrap:nowrap;gap:6px}.chipr .rw{display:none}.chipr{padding:6px 10px}}

/* ================= HOME ================= */
.hero{display:grid;justify-items:center;text-align:center;gap:18px;padding:10px 0 34px;position:relative}
.fan{display:flex;justify-content:center;align-items:flex-end;height:clamp(96px,16vw,150px);margin-bottom:4px;position:relative;z-index:0}
.fan .cback{width:clamp(64px,10vw,104px);margin:0 -10px;pointer-events:none;animation:floaty 5s ease-in-out infinite}
.fan .cback:nth-child(1){transform:rotate(-14deg) translateY(12px);animation-delay:-1s}
.fan .cback:nth-child(2){transform:rotate(-5deg);animation-delay:-2s}
.fan .cback:nth-child(3){transform:rotate(5deg);animation-delay:-3s}
.fan .cback:nth-child(4){transform:rotate(14deg) translateY(12px);animation-delay:-4s}
@keyframes floaty{50%{translate:0 -8px}}
.logo{position:relative;z-index:1;display:grid;justify-items:center;line-height:.82;font-family:'Big Shoulders Display',Impact,sans-serif;font-weight:900;text-transform:uppercase;letter-spacing:0;margin:0}
.logo .l1{font-size:clamp(22px,4.4vw,44px);letter-spacing:.55em;padding-left:.55em;color:#fff;display:flex;align-items:center;gap:.4em}
.logo .l1::before,.logo .l1::after{content:'';width:clamp(26px,6vw,70px);height:4px;border-radius:4px;background:linear-gradient(90deg,var(--acc2),var(--acc))}
.logo .l2{font-size:clamp(84px,19vw,210px);color:#ffd23f;-webkit-text-stroke:.05em #0b0d1f;paint-order:stroke fill;text-shadow:.03em .04em 0 #ff3d7f,.06em .08em 0 rgba(0,0,0,.45);background:none;margin-top:.02em}
.logo .l3{font-size:clamp(30px,6.4vw,70px);letter-spacing:.32em;padding:.08em .4em .06em .72em;color:#fff;background:linear-gradient(90deg,#ff3d7f,#ff8a3d);border:.06em solid #0b0d1f;transform:skewX(-10deg);margin-top:.06em;box-shadow:.12em .12em 0 rgba(0,0,0,.4)}
.logo .l3 span{display:inline-block;transform:skewX(10deg)}
.tagline{max-width:40ch;margin:4px auto 0;font-size:clamp(16px,2.1vw,20px);color:var(--muted)}
.tagline b{color:var(--text)}
.feats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.feat{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:1px solid var(--line2);background:color-mix(in srgb,var(--panel) 80%,transparent);font-weight:600;font-size:14px}
.feat svg{width:18px;height:18px;color:var(--cur)}
.cta{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.resume{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;border:2px solid var(--cur);background:color-mix(in srgb,var(--cur) 12%,var(--panel));border-radius:16px;padding:10px 12px 10px 18px;font-weight:600}
.sect-h{text-align:center;margin:10px 0 18px}
.sect-h h2{font-size:clamp(34px,6vw,56px);text-transform:uppercase}
.sect-h p{margin:8px auto 0;color:var(--muted);max-width:52ch}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:980px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.tiles{grid-template-columns:1fr}}
.tile{position:relative;overflow:hidden;border-radius:22px;border:2px solid rgba(255,255,255,.14);min-height:230px;padding:0;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;background:#111;box-shadow:0 18px 40px -22px #000;transition:transform .2s,box-shadow .2s,border-color .2s;isolation:isolate}
.tile:hover,.tile:focus-visible{transform:translateY(-6px) rotate(-.4deg);box-shadow:0 28px 50px -20px var(--tg,#000);border-color:var(--tg,#fff)}
.tile .t-art{position:absolute;inset:0;z-index:-1}
.tile .t-art svg{width:100%;height:100%;display:block}
.tile .t-body{display:grid;gap:4px;padding:56px 18px 16px;background:linear-gradient(0deg,rgba(0,0,0,.9) 0,rgba(0,0,0,.72) 55%,transparent)}
.t-meta svg{width:14px;height:14px}.t-meta .ci{width:15px;height:15px}
.t-kick{font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--tg)}
.t-title{font-size:44px;line-height:.9;color:#fff}
.t-sub{color:rgba(255,255,255,.78);font-size:14px}
.t-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.t-meta span{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.2);color:#fff}
.t-play{position:absolute;top:14px;right:14px;font-weight:800;font-size:13px;padding:6px 12px;border-radius:999px;background:var(--tg);color:#111;opacity:0;transform:translateY(-6px);transition:.2s}
.tile:hover .t-play,.tile:focus-visible .t-play{opacity:1;transform:none}
.t-marvel{--tg:#ffd400}.t-marvel .t-title{font-family:'Bangers',Impact,sans-serif;letter-spacing:.05em;font-size:56px;color:#ffd400;-webkit-text-stroke:2px #000;paint-order:stroke fill;text-shadow:4px 4px 0 #e62429}
.t-naruto{--tg:#ff8a1f}.t-naruto .t-title{font-family:'Shojumaru',serif;font-size:42px;color:#ff8a1f;text-shadow:3px 3px 0 #000}
.t-onepiece{--tg:#f2c14e}.t-onepiece .t-title{font-family:'Pirata One',serif;font-size:54px;color:#f8e7b8;text-shadow:3px 3px 0 #5a1d0c}
.t-mahabharat{--tg:#ffb347}.t-mahabharat .t-title{font-family:'Yatra One',serif;font-size:52px;color:#ffd06a;text-shadow:0 0 18px rgba(255,138,31,.6),2px 3px 0 #3d0b12;line-height:1}
.t-mahabharat .t-en{font-family:'Cinzel',serif;font-weight:900;letter-spacing:.24em;font-size:15px;color:#ffcf8a}
.t-ben10{--tg:#39e67a}.t-ben10 .t-title{font-family:'Orbitron',sans-serif;font-weight:900;font-size:40px;color:#39e67a;text-shadow:0 0 18px rgba(57,230,122,.6)}
.t-custom{--tg:#9aa6ff;border-style:dashed}.t-custom .t-title{font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:46px}
.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:34px}

/* ================= PANELS / SETUP ================= */
.wrap{max-width:880px;margin:0 auto;display:grid;gap:16px}
.banner{position:relative;overflow:hidden;border-radius:22px;border:2px solid var(--line2);min-height:210px;display:flex;align-items:flex-end;padding:20px 22px;isolation:isolate;background:radial-gradient(ellipse at 80% 30%,color-mix(in srgb,var(--acc) 45%,var(--bg2)),var(--bg2) 60%,var(--bg))}
.banner .t-art{position:absolute;top:0;bottom:0;right:0;width:58%;z-index:-1;-webkit-mask:linear-gradient(90deg,transparent,#000 35%);mask:linear-gradient(90deg,transparent,#000 35%)}.banner .t-art svg{width:100%;height:100%;display:block}
.banner::after{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,rgba(0,0,0,.6),transparent 60%)}
@media (max-width:640px){.banner{min-height:170px}.banner .t-art{width:80%;opacity:.7}}
.banner h1{font-size:clamp(40px,8vw,72px);color:#fff;text-shadow:3px 3px 0 rgba(0,0,0,.5)}
.banner p{margin:6px 0 0;color:rgba(255,255,255,.85)}
.box{background:linear-gradient(180deg,var(--panel),color-mix(in srgb,var(--panel) 70%,var(--bg)));border:1px solid var(--line2);border-radius:var(--r);padding:18px 20px;box-shadow:0 14px 40px -26px #000}
.box>h3{font-size:clamp(24px,3.6vw,30px);margin-bottom:6px;display:flex;align-items:center;gap:10px}
.box>h3 svg{width:24px;height:24px;color:var(--acc)}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:14px 0}
.row+.row{border-top:1px solid var(--line)}
.row .lbl{flex:1 1 240px;min-width:0}
.row .lbl b{display:block;font-weight:700}
.row .lbl small{display:block;color:var(--muted);font-size:13.5px;margin-top:2px}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--bg);border:1px solid var(--line2);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:10px;padding:9px 14px;font-weight:700;color:var(--muted);min-height:40px}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--acc);color:var(--on-acc);box-shadow:0 6px 18px -8px var(--glow)}
/* number picker: wheel, drag, +/- */
.np{display:inline-flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--line2);border-radius:14px;padding:4px;user-select:none;touch-action:none}
.np:focus-visible{outline:3px solid var(--acc2)}
.np button{width:40px;height:40px;border-radius:10px;border:0;background:var(--panel2);font-size:22px;font-weight:700;line-height:1}
.np button:hover{background:var(--acc);color:var(--on-acc)}
.np output{min-width:76px;text-align:center;font-family:var(--disp);font-weight:var(--dw);letter-spacing:var(--dls);font-size:26px;cursor:ns-resize;padding:0 4px}
.np output small{font-family:var(--body);font-size:13px;font-weight:600;color:var(--muted);margin-left:3px;letter-spacing:0}
.np[data-hint]::after{content:attr(data-hint);display:none}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:6px}
.nm-in{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:14px;padding:4px 6px 4px 6px;border:1px solid var(--line2)}
.nm-in:focus-within{border-color:var(--acc2)}
.nm-in input{flex:1;min-width:0;border:0;background:none;color:var(--text);font:600 17px var(--body);padding:10px 4px}
.nm-in input:focus{outline:none}
.av{--pc:#888;width:32px;height:32px;flex:none;border-radius:10px;background:var(--pc);color:#10142e;display:grid;place-items:center;font:800 13px var(--body);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.av.lg{width:44px;height:44px;font-size:17px;border-radius:13px}
.toggle{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.toggle input{width:22px;height:22px;accent-color:var(--acc);flex:none;margin-top:2px}
.code{font:900 40px var(--disp);letter-spacing:.24em;color:var(--cur)}
.startbar{position:sticky;bottom:10px;z-index:5}
.startbar .btn{width:100%;min-height:66px;font-size:21px;font-family:var(--disp);font-weight:var(--dw);letter-spacing:var(--dls);text-transform:uppercase}

/* ================= CURRENCY ICON ================= */
.cur{display:inline-flex;align-items:center;gap:.28em;font-weight:800;white-space:nowrap}
.ci{width:1.05em;height:1.05em;flex:none;display:inline-block;vertical-align:-.15em}

/* ================= CARD BACKS ================= */
.cback{position:relative;aspect-ratio:5/7;border-radius:16px;border:3px solid rgba(255,255,255,.9);overflow:hidden;padding:0;background:#222;box-shadow:0 18px 30px -16px #000;display:block}
.cback svg{position:absolute;inset:0;width:100%;height:100%}
.cback .qm{position:absolute;inset:0;display:grid;place-items:center;font:900 clamp(44px,9vw,84px)/1 var(--disp);color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.35);letter-spacing:0}

/* ================= GAME LAYOUT ================= */
.game{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.stage{position:relative;background:linear-gradient(180deg,color-mix(in srgb,var(--panel) 92%,transparent),color-mix(in srgb,var(--panel2) 70%,transparent));border:1px solid var(--line2);border-radius:24px;padding:22px;min-width:0;box-shadow:0 20px 50px -30px #000}
.turnh{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.turnh h2{font-size:clamp(30px,5vw,50px)}
.turnh h2 em{font-style:normal;color:var(--pc)}
.turnh p{margin:4px 0 0;color:var(--muted)}
.backs{display:flex;justify-content:center;gap:clamp(10px,3vw,30px);padding:30px 0 18px}
.backs .cback{width:min(200px,30%);cursor:pointer;transition:transform .2s,box-shadow .2s;animation:deal .55s cubic-bezier(.2,.9,.3,1.2) backwards}
.backs .cback:nth-child(1){rotate:-4deg}.backs .cback:nth-child(2){rotate:1deg;translate:0 -8px;animation-delay:.08s}.backs .cback:nth-child(3){rotate:5deg;animation-delay:.16s}
.backs .cback:hover,.backs .cback:focus-visible{transform:translateY(-16px) scale(1.04);rotate:0deg;box-shadow:0 26px 40px -14px var(--glow)}
@keyframes deal{from{opacity:0;transform:translateY(-80px) rotate(-20deg) scale(.7)}}
.hint{text-align:center;color:var(--muted);margin:0;font-size:15px}

/* roster */
.roster{display:grid;gap:10px;position:sticky;top:12px}
.roster>h3{font-size:22px;padding:0 4px;display:flex;justify-content:space-between;align-items:baseline}
.roster>h3 small{font:600 13px var(--body);color:var(--muted);letter-spacing:0}
.pcard{--pc:#888;background:var(--panel);border:1px solid var(--line2);border-left:6px solid var(--pc);border-radius:16px;padding:10px 12px;transition:box-shadow .2s}
.pcard.now{box-shadow:0 0 0 2px var(--pc),0 10px 30px -12px var(--pc)}
.pcard.out{opacity:.5}
.pcard .hd{display:flex;align-items:center;gap:10px}
.pcard .nmx{flex:1;min-width:0}
.pcard .nmx b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .nmx small{color:var(--muted);font-size:12px;font-weight:600}
.pcard .bal{font:var(--dw) 26px/1 var(--disp);letter-spacing:var(--dls);color:var(--cur);display:flex;align-items:center;gap:4px}
.pcard .bal .ci{width:18px;height:18px}
.badge{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:3px 8px;background:var(--panel2);border:1px solid var(--line2);white-space:nowrap}
.badge.go{background:var(--pc);border-color:var(--pc);color:#10142e}
.badge.bad{background:var(--bad);border-color:var(--bad);color:#200}
.badge.okb{background:var(--ok);border-color:var(--ok);color:#03200d}
.slots{display:flex;gap:5px;margin-top:8px}
.slot{flex:1;max-width:44px;aspect-ratio:5/7;border-radius:7px;border:1.5px dashed var(--line2);overflow:hidden;position:relative}
.slot.req{border-color:var(--muted)}
.slot.f{border:0}
@media (max-width:980px){
  .game{display:flex;flex-direction:column}.game>*{min-width:0;max-width:100%}
  .roster{order:-1;position:static;display:flex;overflow-x:auto;gap:8px;padding:2px 2px 6px;scroll-snap-type:x mandatory}
  .roster>h3{display:none}
  .pcard{min-width:200px;flex:none;scroll-snap-align:start}
}
@media (max-width:640px){.stage{padding:16px;border-radius:20px}.pcard{min-width:168px}.pcard .bal{font-size:22px}}

/* ================= BIG CARD ================= */
.cx{--cc:#555;--rc:#aaa;--fxc:#fff;position:relative;aspect-ratio:5/7;width:100%;border-radius:18px;overflow:hidden;isolation:isolate;background:#111;container-type:inline-size}
.cx-bg{position:absolute;inset:0;z-index:0;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--cc) 75%,#fff 10%),color-mix(in srgb,var(--cc) 55%,#000) 70%)}
.cx-bg::before{content:'';position:absolute;inset:-40%;background:repeating-conic-gradient(rgba(255,255,255,.09) 0 7deg,transparent 7deg 18deg);animation:spin 60s linear infinite}
.cx-fx{position:absolute;inset:0;z-index:1;pointer-events:none}
.cx-fx svg{width:100%;height:100%;display:block;overflow:visible}
.cx-fig{position:absolute;inset:0;z-index:2;display:grid;place-items:center}
.cx-fig img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.cx-fig .emb{width:62%;color:#fff;filter:drop-shadow(0 6px 0 rgba(0,0,0,.3)) drop-shadow(0 0 22px var(--fxc))}
.cx-fig .emb svg{width:100%;height:auto;display:block}
.cx-fig .mono{position:absolute;bottom:22%;font:var(--dw) 13cqw/1 var(--disp);letter-spacing:var(--dls);color:rgba(255,255,255,.18)}
.cx-frame{position:absolute;inset:0;z-index:3;pointer-events:none;border-radius:inherit}
.cx-rar{position:absolute;z-index:4;top:6%;left:6%;font:800 max(9px,4.6cqw)/1 var(--body);letter-spacing:.08em;text-transform:uppercase;padding:.45em .8em;border-radius:999px;background:var(--rc);color:#10142e;box-shadow:0 0 14px -2px var(--rc)}
.cx-name{position:absolute;z-index:4;left:5%;right:5%;bottom:4.5%;display:grid;gap:2px;text-align:center;padding:.6em .5em;border-radius:12px;background:rgba(8,10,24,.82);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.2)}
.cx-name b{font:var(--dw) max(10px,8.4cqw)/1.02 var(--disp);letter-spacing:var(--dls);text-transform:uppercase;color:#fff;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:normal}
.cx-name i{font-style:normal;font-size:max(10px,4.6cqw);color:rgba(255,255,255,.75);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cx.mini{border-radius:inherit}
.cx.mini .cx-bg::before{display:none}
.cx.mini .cx-fig .emb{width:70%;filter:none}
.cx.mini .cx-fig .mono{display:none}
.cx.rar-legendary{box-shadow:0 0 0 3px var(--rc),0 0 40px -6px var(--rc)}
.cx.rar-epic{box-shadow:0 0 0 3px var(--rc),0 0 30px -8px var(--rc)}
.cx.rar-rare{box-shadow:0 0 0 2px var(--rc)}
.cx:not(.mini) .cx-frame{box-shadow:inset 0 0 0 3px rgba(255,255,255,.85)}
.cx.flip{animation:flipin .6s cubic-bezier(.2,.8,.2,1.15)}
@keyframes flipin{from{transform:perspective(900px) rotateY(95deg) scale(.85);opacity:.2}}
.cx.tilt{transform:perspective(800px) rotateY(var(--ry,0deg)) rotateX(var(--rx,0deg));transition:transform .15s ease-out}

/* deck card frames */
[data-deck=marvel] .cx-bg{background:radial-gradient(rgba(0,0,0,.28) 1.4px,transparent 1.8px) 0 0/8px 8px,radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--cc) 80%,#fff 15%),color-mix(in srgb,var(--cc) 55%,#000) 72%)}
[data-deck=marvel] .cx:not(.mini) .cx-frame{box-shadow:inset 0 0 0 4px #000,inset 0 0 0 8px #ffd400,inset 0 0 0 11px #000}
[data-deck=marvel] .cx-name{background:#ffd400;border:3px solid #000;border-radius:4px;transform:skewX(-6deg);box-shadow:4px 4px 0 #000}
[data-deck=marvel] .cx-name b{color:#000}[data-deck=marvel] .cx-name i{color:#3a2a00}
[data-deck=marvel] .cx-rar{border:2px solid #000;top:7%;left:7%}
[data-deck=naruto] .cx-bg{background:radial-gradient(circle at 50% 36%,#ffb066 0,color-mix(in srgb,var(--cc) 60%,#ff7a00) 34%,#1a0a02 78%)}
[data-deck=naruto] .cx:not(.mini) .cx-frame{box-shadow:inset 0 0 0 3px #1a0a02,inset 0 0 0 6px #ff7a00,inset 0 0 0 8px #1a0a02}
[data-deck=naruto] .cx-name{background:linear-gradient(180deg,#f6e4c3,#e3c592);color:#2a1406;border:0;border-radius:4px;box-shadow:0 -2px 0 #8a4a14 inset,0 2px 0 #8a4a14 inset}
[data-deck=naruto] .cx-name b{color:#2a1406}[data-deck=naruto] .cx-name i{color:#6b3a12}
[data-deck=onepiece] .cx-bg{background:radial-gradient(circle at 50% 30%,#f7ebc8,#e6cf96 60%,#c9a866)}
[data-deck=onepiece] .cx-bg::before{display:none}
[data-deck=onepiece] .cx:not(.mini) .cx-fig{inset:20% 9% 26%;border:3px solid #3a2410;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--cc) 70%,#fff 10%),color-mix(in srgb,var(--cc) 50%,#000));overflow:hidden}
[data-deck=onepiece] .cx:not(.mini) .cx-fx{inset:20% 9% 26%;overflow:hidden}
[data-deck=onepiece] .cx:not(.mini) .cx-frame{box-shadow:inset 0 0 0 2px #7a5528,inset 0 0 30px rgba(90,50,10,.55)}
[data-deck=onepiece] .cx-wanted{position:absolute;z-index:4;top:4%;left:0;right:0;text-align:center;font:400 15cqw/1 'Pirata One',serif;color:#3a2410;letter-spacing:.04em}
[data-deck=onepiece] .cx-rar{top:auto;bottom:27%;left:50%;translate:-50% 50%}
[data-deck=onepiece] .cx-name{background:none;border:0;backdrop-filter:none;bottom:3%}
[data-deck=onepiece] .cx-name b{color:#3a2410;font-family:'Pirata One',serif;font-size:max(14px,10cqw)}
[data-deck=onepiece] .cx-name i{color:#5a3a18}
[data-deck=onepiece] .cx-bounty{font:400 max(13px,9cqw)/1 'Pirata One',serif;color:#3a2410;display:flex;align-items:center;justify-content:center;gap:4px}
[data-deck=mahabharat] .cx-bg{background:radial-gradient(circle at 50% 36%,#ffd27a 0,color-mix(in srgb,var(--cc) 55%,#ff8a1f) 32%,#3d0b12 76%)}
[data-deck=mahabharat] .cx:not(.mini) .cx-frame{box-shadow:inset 0 0 0 3px #2a0508,inset 0 0 0 6px #d9a53a,inset 0 0 0 8px #2a0508,inset 0 0 0 10px #f4c542}

[data-deck=mahabharat] .cx-name b{color:#ffd27a;font-family:'Cinzel',serif;font-weight:900;font-size:max(13px,8cqw)}
[data-deck=ben10] .cx-bg{background:linear-gradient(60deg,rgba(57,230,122,.12) 1px,transparent 1px) 0 0/14px 24px,linear-gradient(-60deg,rgba(57,230,122,.12) 1px,transparent 1px) 0 0/14px 24px,radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--cc) 45%,#39e67a),#020604 75%)}
[data-deck=ben10] .cx:not(.mini) .cx-frame{box-shadow:inset 0 0 0 2px #39e67a,inset 0 0 26px rgba(57,230,122,.35)}
[data-deck=ben10] .cx-name{background:rgba(2,10,6,.85);border:1px solid #39e67a;border-radius:4px}
[data-deck=ben10] .cx-name b{color:#b6ff5c;font-size:max(12px,7.4cqw)}

/* ================= BID STAGE ================= */
.bidtop{display:grid;grid-template-columns:minmax(190px,260px) minmax(0,1fr);gap:24px;align-items:start}
.bidtop .cardcol{display:grid;gap:10px}
.cinfo .by{color:var(--muted);font-size:14px;display:flex;align-items:center;gap:8px}
.cinfo h2{font-size:clamp(34px,5.4vw,58px);margin:4px 0 2px;text-transform:uppercase;background:linear-gradient(90deg,var(--text),color-mix(in srgb,var(--cc) 60%,var(--text)));-webkit-background-clip:text;background-clip:text;color:transparent}
.cinfo .form{font-weight:700;color:var(--acc);font-size:16px}
.cinfo p.d{margin:10px 0 0;max-width:56ch;font-size:15.5px}
.stats{display:grid;gap:6px;margin-top:14px;max-width:440px}
.st{display:grid;grid-template-columns:62px 1fr 30px;gap:10px;align-items:center;font:800 11.5px var(--body);letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.st u{height:9px;border-radius:9px;background:var(--line);overflow:hidden;display:block;text-decoration:none}
.st u i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));border-radius:9px;animation:grow .9s cubic-bezier(.2,.8,.2,1) backwards}
.st b{color:var(--text);font-size:13px;text-align:right}
@keyframes grow{from{width:0!important}}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.tag{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--panel2);border:1px solid var(--line2)}
.tag.pow{background:var(--rc);color:#10142e;border-color:var(--rc)}
.auct{margin-top:20px;border-top:2px dashed var(--line2);padding-top:18px;display:grid;gap:14px}
.leadbox{--pc:#888;display:flex;align-items:center;gap:14px;border-radius:18px;padding:12px 16px;background:linear-gradient(90deg,color-mix(in srgb,var(--pc) 22%,var(--panel2)),var(--panel2));border:2px solid var(--pc);box-shadow:0 10px 30px -14px var(--pc)}
.leadbox .who{flex:1;min-width:0}
.leadbox .who small{display:block;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.leadbox .who b{display:block;font:var(--dw) clamp(24px,3.6vw,34px)/1.05 var(--disp);letter-spacing:var(--dls);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leadbox .amt{display:flex;align-items:center;gap:8px;font:var(--dw) clamp(46px,7vw,68px)/.9 var(--disp);letter-spacing:0;color:var(--cur);text-shadow:0 0 30px color-mix(in srgb,var(--cur) 40%,transparent)}
.leadbox .amt .ci{width:.62em;height:.62em}
.bump{animation:bump .3s ease}@keyframes bump{40%{transform:scale(1.07)}}
.tm{display:flex;align-items:center;gap:12px}
.tmb{flex:1;height:12px;border-radius:9px;background:var(--line);overflow:hidden}
.tmb i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--acc2),var(--cur));border-radius:9px}
.tm b{font:var(--dw) 30px/1 var(--disp);min-width:56px;text-align:right}
.tm.hot b{color:var(--bad)}.tm.hot .tmb i{background:var(--bad)}
.how-bid{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.how-bid p{margin:0;font-weight:700}
.how-bid p small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.ptiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.ptile{--pc:#888;position:relative;display:flex;align-items:center;gap:10px;text-align:left;border:2px solid var(--line2);background:var(--panel2);border-radius:16px;padding:10px 12px;min-height:66px;transition:transform .12s,border-color .15s,background .15s}
.ptile:hover:not(:disabled){transform:translateY(-2px);border-color:var(--pc)}
.ptile .tx{flex:1;min-width:0}
.ptile .tx b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptile .tx small{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.ptile .plus{font:var(--dw) 20px/1 var(--disp);color:var(--pc);white-space:nowrap}
.ptile.lead{background:var(--pc);border-color:var(--pc);color:#10142e}
.ptile.lead .tx small,.ptile.lead .plus{color:#10142e}
.ptile.lead .av{background:#10142e;color:var(--pc)}
.ptile:disabled{opacity:.35}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.soldbtn{width:100%;min-height:66px;font-size:20px;border-radius:18px;font-family:var(--disp);font-weight:var(--dw);letter-spacing:var(--dls);text-transform:uppercase;background:var(--cur);border:0;color:var(--cur-ink);box-shadow:0 14px 34px -14px var(--cur),inset 0 -4px 0 rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;gap:12px;padding:10px 16px}
.soldbtn svg{width:28px;height:28px}
.soldbtn:hover{filter:brightness(1.08)}
.soldbar{padding:4px 0 0}
@media (max-width:700px){.soldbtn{font-size:16px;min-height:58px;white-space:nowrap}.soldbtn svg{width:22px;height:22px}.turnh{flex-wrap:nowrap;gap:10px}.turnh h2{font-size:28px}.soldbar{position:sticky;bottom:0;z-index:6;padding:10px 0 calc(8px + env(safe-area-inset-bottom));background:linear-gradient(0deg,var(--panel) 72%,transparent)}}
.autobox{border:2px solid var(--cur);border-radius:16px;padding:14px 16px;background:color-mix(in srgb,var(--cur) 10%,var(--panel2));display:grid;gap:10px}
.swapl{display:grid;gap:8px}
.swapl button{display:flex;align-items:center;gap:12px;text-align:left;justify-content:space-between}
.swapl .th{width:42px;flex:none;border-radius:8px;overflow:hidden}
.exs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.ex{--pc:#888;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--panel2);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:700}
.ex i{width:9px;height:9px;border-radius:50%;background:var(--pc)}
.ex.done{border-color:var(--ok)}
@media (max-width:700px){
  .bidtop{grid-template-columns:1fr;justify-items:center;text-align:center;gap:14px}
  .bidtop .cardcol{width:min(230px,70vw)}
  .cinfo .by{justify-content:center}.stats{margin:12px auto 0}.tags{justify-content:center}
  .ptiles{grid-template-columns:1fr 1fr}
  .ptile{padding:8px 10px;min-height:58px}.ptile .av{display:none}
}

/* ================= OVERLAYS ================= */
.ov{position:fixed;inset:0;z-index:40;background:rgba(3,4,14,.72);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;animation:fadein .2s}
@keyframes fadein{from{opacity:0}}
.sheet{background:var(--panel);border:1px solid var(--line2);border-radius:22px;padding:22px;width:min(480px,100%);max-height:88vh;overflow:auto;display:grid;gap:12px;box-shadow:0 30px 80px -20px #000;animation:pop .25s cubic-bezier(.2,.9,.3,1.2)}
.sheet.wide{width:min(760px,100%)}
.sheet h2{font-size:34px}
.sheet .mi{display:flex;align-items:center;gap:12px;justify-content:flex-start;text-align:left}
.sheet .mi svg{width:22px;height:22px;color:var(--acc);flex:none}
.sheet .mi small{display:block;font-weight:500;color:var(--muted);font-size:13px}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(12px)}}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:700;z-index:80;max-width:min(92vw,420px);text-align:center;box-shadow:0 14px 30px -12px #000;animation:pop .2s}
/* gavel */
#gv{position:fixed;inset:0;z-index:50;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:clamp(8px,1.6vh,16px);padding:20px 16px;text-align:center;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--pc) 34%,var(--bg)),var(--bg) 72%)}
#gv::before{content:'';position:fixed;inset:-50%;z-index:-1;background:repeating-conic-gradient(color-mix(in srgb,var(--cur) 14%,transparent) 0 8deg,transparent 8deg 20deg);animation:spin 40s linear infinite;opacity:.6}
.gv-cap{font-size:12px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.gv-card{width:clamp(84px,15vh,150px)}
.gv-name{font:var(--dw) clamp(28px,5vw,52px)/1 var(--disp);letter-spacing:var(--dls);text-transform:uppercase}
.gv-num{min-height:clamp(90px,17vh,190px);display:grid;place-items:center}
.gvn{font:var(--dw) clamp(90px,17vh,190px)/.85 var(--disp);color:var(--cur);text-shadow:0 .04em 0 rgba(0,0,0,.5),0 0 60px color-mix(in srgb,var(--cur) 50%,transparent);animation:slam .45s cubic-bezier(.2,.9,.3,1.4)}
@keyframes slam{from{opacity:0;transform:scale(2.6) rotate(-8deg)}60%{transform:scale(.94)}}
.gv-call{font:var(--dw) clamp(18px,3vw,26px)/1 var(--disp);letter-spacing:.2em;text-transform:uppercase;color:var(--cur);min-height:1.1em}
.gv-lead{--pc:#888;display:flex;align-items:center;gap:14px;background:var(--panel);border:2px solid var(--pc);border-radius:18px;padding:10px 16px;min-width:min(360px,92vw);text-align:left}
.gv-lead .who{flex:1}.gv-lead .who small{display:block;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.gv-lead .who b{font:var(--dw) 26px/1.1 var(--disp);letter-spacing:var(--dls)}
.gv-lead .amt{font:var(--dw) 48px/1 var(--disp);color:var(--cur);display:flex;align-items:center;gap:6px}
.gv-lead .amt .ci{width:.6em;height:.6em}
.gv-out{display:grid;gap:8px;justify-items:center;width:min(520px,100%)}
.gv-out .ptiles{width:100%}
.stamp{font:var(--dw) min(16vh,17vw,150px)/.9 var(--disp);letter-spacing:var(--dls);padding:.08em .22em;transform:rotate(-7deg);animation:stamp .5s cubic-bezier(.2,.9,.3,1.3);white-space:nowrap}
@keyframes stamp{from{opacity:0;transform:scale(3) rotate(-22deg)}to{transform:rotate(-7deg)}}
.stamp.s-default{background:var(--pc);color:#fff;border-radius:.12em;text-shadow:.04em .04em 0 rgba(0,0,0,.35)}
.stamp.s-marvel{color:#e62429;background:#ffd400;border:.06em solid #000;clip-path:polygon(0 15%,8% 0,22% 12%,35% 0,50% 10%,64% 0,78% 12%,92% 0,100% 18%,94% 50%,100% 82%,90% 100%,76% 88%,62% 100%,48% 90%,34% 100%,20% 88%,8% 100%,0 84%,6% 50%);padding:.25em .5em;-webkit-text-stroke:.03em #000;paint-order:stroke fill}
.stamp.s-naruto{color:#c4161c;border:.07em solid #c4161c;border-radius:.08em;background:rgba(255,240,220,.92);font-family:'Shojumaru',serif}
.stamp.s-onepiece{color:#f8e7b8;background:#8a2a14;border:.05em dashed #f8e7b8;font-family:'Pirata One',serif;border-radius:.1em}
.stamp.s-mahabharat{font-family:'Yatra One',serif;font-size:min(18vh,19vw,150px);color:#ffd27a;text-shadow:0 0 40px #ff8a1f,0 .05em 0 #3d0b12;transform:none;animation:stamp2 .7s cubic-bezier(.2,.9,.3,1.3)}
@keyframes stamp2{from{opacity:0;transform:scale(.3)}60%{transform:scale(1.12)}}
.stamp.s-ben10{color:#b6ff5c;border:.05em solid #39e67a;font-family:'Orbitron',sans-serif;background:rgba(3,20,10,.9);box-shadow:0 0 40px #39e67a;font-size:min(10vh,11vw,96px);transform:none}
.gv-to{font-weight:800;font-size:18px}
.shk{animation:shk .45s}@keyframes shk{20%{transform:translate(-8px,4px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-5px,-3px)}80%{transform:translate(4px,3px)}}
/* big reveal */
#brv{position:fixed;inset:0;z-index:45;display:grid;place-content:center;justify-items:center;gap:12px;background:rgba(3,4,14,.86);backdrop-filter:blur(6px);text-align:center;padding:20px;animation:fadein .25s}
#brv.out{animation:brvOut .3s ease forwards}@keyframes brvOut{to{opacity:0;transform:scale(.85)}}
#brv .cx{width:min(64vw,270px)}
#brv h2{font-size:clamp(30px,6vw,52px);text-transform:uppercase}

/* ================= END / BOARD ================= */
.endh{text-align:center;display:grid;gap:8px;margin:6px 0 18px}
.endh h1{font-size:clamp(44px,8vw,86px);text-transform:uppercase}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.rcard{--pc:#888;background:var(--panel);border:1px solid var(--line2);border-top:6px solid var(--pc);border-radius:18px;padding:14px;display:grid;gap:10px}

function spiral(cx,cy,turns,R){let p=[];const n=Math.round(turns*36);for(let i=0;i<=n;i++){const a=i/36*Math.PI*2,r=R*i/n;p.push((cx+r*Math.cos(a)).toFixed(1)+' '+(cy+r*Math.sin(a)).toFixed(1))}return'M'+p.join(' L')}

const mf=m=>440*Math.pow(2,(m-69)/12);

 if(o.det)os.detune.value=o.det;let node=os;
 if(o.cut){const fl=a.createBiquadFilter();fl.type='lowpass';fl.frequency.value=o.cut;fl.Q.value=o.q||.7;os.connect(fl);node=fl}
 if(o.vib){const l=a.createOscillator(),lg=a.createGain();l.frequency.value=o.vibr||5.5;lg.gain.value=o.vib;l.connect(lg);lg.connect(os.frequency);l.start(t);l.stop(t+d+.2)}

/* number picker (wheel / drag / buttons / arrows) */
function np(t,k,val,min,max,step=1,o={}){return`<div class=np role=spinbutton tabindex=0 aria-label="${esc(o.label||k)}" aria-valuenow="${val}" aria-valuemin="${min}" aria-valuemax="${max}" data-t="${t}" data-k="${k}" data-min="${min}" data-max="${max}" data-step="${step}" title="Scroll, drag or tap − / +"><button type=button data-d="-1" aria-label="Decrease">−</button><output>${val===0&&o.zero?o.zero:val}${o.suf&&!(val===0&&o.zero)?`<small>${o.suf}</small>`:''}</output><button type=button data-d="1" aria-label="Increase">+</button></div>`}
function npTarget(t){return t=='s'?G.s:t=='cb'?G.cb:null}
function npStep(el,dir){const T=npTarget(el.dataset.t),k=el.dataset.k;if(!T)return;const min=+el.dataset.min,max=+el.dataset.max,st=+el.dataset.step;let v=T[k]+dir*st;
 if(k=='timer'&&dir>0&&T[k]==0)v=5;if(k=='timer'&&dir<0&&T[k]<=5)v=0;v=clamp(Math.round(v),min,max);if(v===T[k])return;T[k]=v;
 if(el.dataset.t=='s'){if(k=='max'&&T.min>T.max)T.min=T.max;if(k=='min'&&T.min>T.max)T.max=T.min;if(k=='n')while(T.names.length<T.n)T.names.push('')}
 R();const n=$(`.np[data-t="${el.dataset.t}"][data-k="${k}"]`);if(n&&document.activeElement===document.body)n.focus({preventScroll:true})}
document.addEventListener('click',e=>{const b=e.target.closest('.np button');if(b){e.preventDefault();npStep(b.closest('.np'),+b.dataset.d)}});
document.addEventListener('wheel',e=>{const el=e.target.closest('.np');if(!el)return;e.preventDefault();npStep(el,e.deltaY<0?1:-1)},{passive:false});
document.addEventListener('keydown',e=>{const el=e.target.closest&&e.target.closest('.np');if(!el)return;if(e.key=='ArrowUp'||e.key=='ArrowRight'){e.preventDefault();npStep(el,1)}if(e.key=='ArrowDown'||e.key=='ArrowLeft'){e.preventDefault();npStep(el,-1)}});
let DRAG=null;document.addEventListener('pointerdown',e=>{const o=e.target.closest('.np output');if(!o)return;DRAG={y:e.clientY,t:o.closest('.np').dataset.t,k:o.closest('.np').dataset.k};e.preventDefault()});
document.addEventListener('pointermove',e=>{if(!DRAG)return;const dy=DRAG.y-e.clientY;if(Math.abs(dy)>=16){const el=$(`.np[data-t="${DRAG.t}"][data-k="${DRAG.k}"]`);DRAG.y=e.clientY;if(el)npStep(el,dy>0?1:-1)}});
addEventListener('pointerup',()=>DRAG=null);

 t.forEach((id,k)=>{const y=190+k*82,tr=tier(id);x.fillStyle=tr[2];x.fillRect(44,y,10,58);x.fillStyle='#fff';x.font='800 32px Arial';x.fillText(DB[id].n,72,y+28);x.fillStyle='#b8bde0';x.font='600 20px Arial';x.fillText((DB[id].f||'')+(DB[id].f?' · ':'')+tr[0]+' · Power '+power(id),72,y+54)});
 x.fillStyle='#b8bde0';x.font='600 20px Arial';x.fillText('Multi Draft Battle · '+DK().name,44,H-28);
 c.toBlob(bl=>{const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=G.names[i].replace(/\W+/g,'_')+'_team.png';a.click()})}

/* ---------------- leaderboard ---------------- */
const LB={};
function openLB(){G.lb=1;G.lbt=G.lbt||'global';G.lbd=G.lbd||(G.deck||'all');R();if(G.lbt=='global')lbLoad(G.lbd)}
const VALID=n=>n&&!/^(player\s*)?\d+$/i.test(n.trim());
async function lbLoad(d,force){if(LB[d]&&!force&&!LB[d].err)return;const c=sb();if(!c){LB[d]={err:'The global leaderboard needs an internet connection and the hosted link.'};return R()}
 LB[d]={loading:1};R();try{const{data,error}=await c.from('mdb_board').select('*').eq('deck',d).order('match_wins',{ascending:false}).order('points',{ascending:false}).limit(100);LB[d]=error?{err:error.message}:{rows:data||[]}}catch(e){LB[d]={err:String(e.message||e)}}if(G.lb)R()}
function lbView(){const sess=G.names&&G.rp?G:G.saved&&G.saved.rp?G.saved:null,t=G.lbt||'global',d=G.lbd||'all';let body='';
 if(t=='session'){if(!sess||!(sess.rp||[]).some(Boolean))body=`<p class=empty>No rounds scored in this session yet.</p>`;else{const tot=sess.names.map((_,i)=>(sess.rp||[]).reduce((a,r)=>a+(r?r[i]:0),0));
  body=`<div class=lbwrap><table class=tbl><thead><tr><th>#</th><th>Player</th>${sess.rp.map((_,k)=>`<th>R${k+1}</th>`).join('')}<th>Points</th></tr></thead><tbody>${sess.names.map((_,i)=>i).sort((a,b)=>tot[b]-tot[a]).map((i,k)=>`<tr><td><span class="medal m${k+1}">${k+1}</span></td><td class=n>${esc(sess.names[i])}</td>${sess.rp.map(r=>`<td>${r?r[i]:'–'}</td>`).join('')}<td class=big>${tot[i]}</td></tr>`).join('')}</tbody></table></div>`}}
 else{const L=LB[d];const mine=new Set(LS.get('mdb-names',[]).map(x=>x.toLowerCase()));
  body=!L||L.loading?`<p class=empty>Loading…</p>`:L.err?`<p class=empty>${esc(L.err)}</p>`:!L.rows.length?`<p class=empty>No results yet. Finish a round with real player names to get on the board.</p>`:
  `<div class=lbwrap><table class=tbl><thead><tr><th>#</th><th>Player</th><th title="Matches won">Wins</th><th title="Rounds won">Round wins</th><th>Points</th><th>Matches</th></tr></thead><tbody>${L.rows.map((r,k)=>`<tr class="${mine.has(String(r.player).toLowerCase())?'me':''}"><td><span class="medal m${k+1}">${k+1}</span></td><td class=n>${esc(r.player)}</td><td class=big>${r.match_wins}</td><td>${r.round_wins}</td><td>${r.points}</td><td>${r.matches}</td></tr>`).join('')}</tbody></table></div>`}
 return`<div class=ov onclick="if(event.target===this){G.lb=0;R()}"><div class="sheet wide" role=dialog aria-label="Leaderboard">${dlgH(`${ic('trophy')} Leaderboard`,'G.lb=0')}
 <div class=tabs><div class=seg><button class="${t=='session'?'on':''}" onclick="G.lbt='session';R()">This session</button><button class="${t=='global'?'on':''}" onclick="G.lbt='global';R();lbLoad(G.lbd||'all')">Global</button></div></div>
 ${t=='global'?`<div class=tabs><div class=seg>${['all','marvel','naruto','onepiece','mahabharat','ben10','custom'].map(k=>`<button class="${d==k?'on':''}" onclick="G.lbd='${k}';R();lbLoad('${k}')">${k=='all'?'All':DECKS[k].name}</button>`).join('')}</div>${LB[d]&&!LB[d].loading?`<button class="link" onclick="lbLoad('${d}',1)">Refresh</button>`:''}</div>`:''}
 ${body}<p class=muted style="margin:0;font-size:12.5px">Ranked by matches won, then points. Names match exactly (not case-sensitive). Default names like "Player 1" are not saved.</p></div></div>`}
async function saveRound(r){if(!G.rp||!G.rp[r-1]||(G.sent||{})[r])return;const c=sb();if(!c)return;const rows=G.names.map((n,i)=>({match_id:G.mid,room:G.online?G.code:null,deck:G.deck,round:r,player:n.trim().slice(0,24),place:(G.rk||[]).indexOf(i)+1,points:G.rp[r-1][i]||0,bond:bond(G.teams[i]).s,coins_left:G.coins[i],team:G.teams[i].map(id=>nm(id))})).filter(x=>VALID(x.player));
 if(!rows.length)return;G.sent=G.sent||{};G.sent[r]=1;try{const{error}=await c.from('mdb_results').upsert(rows,{onConflict:'match_id,round,player',ignoreDuplicates:true});if(error){G.sent[r]=0;toast('Could not save to the global leaderboard')}else{Object.keys(LB).forEach(k=>delete LB[k]);toast('Round saved to the global leaderboard')}}catch(e){G.sent[r]=0}}

/* =====================================================================
   ONLINE (Supabase Realtime broadcast). The host screen is in charge;
   phones send picks and bids, the host validates them.
   ===================================================================== */
let SB=null;function sb(){if(SB)return SB;try{if(window.supabase&&window.supabase.createClient)SB=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false}})}catch(e){}return SB}
let NET=null,HOOK=0,JOIN=0,PUB=null,ME=null,CODE='',ROOMS={};const HANDLERS={};
function rc(){return Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.random()*24|0]).join('')}
async function netInit(){if(NET!==null)return NET;const c=sb();if(!c){NET=false;return NET}
 NET={async room(code){code=String(code||'').toUpperCase();if(!code)throw new Error('no code');if(ROOMS[code])return ROOMS[code];
   const ch=c.channel('mdb-room-'+code,{config:{broadcast:{self:false}}});ROOMS[code]=ch;Object.keys(HANDLERS).forEach(ev=>ch.on('broadcast',{event:ev},m=>HANDLERS[ev].forEach(fn=>fn({data:m.payload}))));
   try{await new Promise((res,rej)=>{let done=0;ch.subscribe(s=>{if(s==='SUBSCRIBED'){done=1;res()}else if(s==='CHANNEL_ERROR'||s==='TIMED_OUT'){done=1;rej(new Error(s))}});setTimeout(()=>{if(!done)rej(new Error('timeout'))},10000)})}catch(e){delete ROOMS[code];throw e}return ch},
  on(ev,fn){(HANDLERS[ev]||(HANDLERS[ev]=[])).push(fn);Object.values(ROOMS).forEach(ch=>ch.on('broadcast',{event:ev},m=>fn({data:m.payload})))},
  async emit(ev,data){const ch=await this.room(data&&data.c);return ch.send({type:'broadcast',event:ev,payload:data})}};return NET}
const onlineCount=()=>Object.values(G.conn||{}).filter(t=>Date.now()-t<20000).length;
async function netHost(){const r=await netInit();if(!r)return toast('Online play needs the hosted link. Playing on one screen.');
 try{await r.room(G.code||(G.s&&G.s.code))}catch(e){return toast('Could not open the online room. Check the internet connection.')}
 if(!HOOK){HOOK=1;r.on('hello',m=>{const d=m.data;if(!d||d.c!=(G.code||(G.s&&G.s.code)))return;if(d.p!=null&&G.conn){G.conn[d.p]=Date.now()}pushPub(true)});
  r.on('pick',m=>{const d=m.data;if(d&&d.c==G.code&&G.screen=='game'&&G.stage=='pick'&&d.p==G.turn&&d.k>=0&&d.k<G.cards.length)reveal(d.k)});
  r.on('bid',m=>{const d=m.data;if(!d||d.c!=G.code||G.screen!='game'||G.stage!='bid'||!G.bid||G.bid.auto)return;const i=+d.p,a=+d.a;if(!G.names[i]||!canBid(i)||!(a>G.bid.a)||a>maxBid(i))return;setBid(i,a)})}
 pushPub(true)}
let pubT=0,pubLast=0;
function pushPub(now){if(!NET)return;const go=()=>{pubLast=Date.now();if(G.screen=='game'||G.screen=='end'){if(!G.online)return;const b=G.bid,c=G.stage=='pick'?null:G.pick;
  NET.emit('state',{c:G.code,dk:G.deck,cu:G.deck=='custom'?CUSTOM:0,sc:G.screen,st:G.stage,t:G.turn,n:G.names,co:G.coins,ph:G.phase,mx:G.names.map((_,i)=>G.screen=='game'?maxBid(i):0),ok:G.names.map((_,i)=>G.screen=='game'&&canBid(i)?1:0),
   g:GV?1:0,cd:c!=null?c:-1,b:b&&G.stage=='bid'?{p:b.p,a:b.a,au:b.auto?1:0}:0,l:TM.iv?Math.ceil(TM.left):0,v:G.cards?G.cards.length:0,tm:G.teams.map(t=>t.length)}).catch(()=>{})}
  else if(G.screen=='setup'&&G.s.online)NET.emit('state',{c:G.s.code,dk:G.s.deck,sc:'setup',n:G.s.names.slice(0,G.s.n).map((n,i)=>n||'Player '+(i+1))}).catch(()=>{})};
 clearTimeout(pubT);if(now||Date.now()-pubLast>150)go();else pubT=setTimeout(go,150)}
setInterval(()=>{if(NET&&(G.screen=='game'&&G.online))pushPub(true);if(NET&&CODE&&ME!=null&&G.screen=='join')NET.emit('hello',{c:CODE,p:ME}).catch(()=>{})},6000);
function joinStart(){G={screen:'join',saved:G.saved||null};PUB=null;ME=null;R();netJoin()}
async function netJoin(){const r=await netInit();if(r&&!JOIN){JOIN=1;r.on('state',m=>{const d=m.data;if(G.screen!='join'||!d||d.c!=CODE)return;const was=PUB&&PUB.b&&PUB.b.p;
  if(d.dk&&(d.dk!==DECK||(d.dk=='custom'&&d.cu&&d.cu!==CUSTOM)))setDeck(d.dk,d.cu||'');PUB=d;PUB.at=performance.now();
  if(ME!=null&&was===ME&&d.b&&d.b.p!==ME){try{navigator.vibrate&&navigator.vibrate([80,40,80])}catch(e){}toast(d.n[d.b.p]+' outbid you · now '+d.b.a)}R()})}R()}
let JOINAT=0;
async function joinTry(){CODE=($('#jc').value||'').trim().toUpperCase();if(CODE.length<4)return toast('Type the 4-letter code from the host screen');LS.set('mdb-join',{c:CODE,me:ME});JOINAT=Date.now();R();
 try{await NET.room(CODE);await NET.emit('hello',{c:CODE})}catch(e){toast('Could not reach that room')}setTimeout(()=>{if(G.screen=='join'&&!PUB)R()},6500)}
function pickSeat(i){ME=i;LS.set('mdb-join',{c:CODE,me:ME});NET&&NET.emit('hello',{c:CODE,p:ME}).catch(()=>{});R()}
const jbid=a=>{if(!NET)return;NET.emit('bid',{c:CODE,p:ME,a}).then(()=>SX.play('coin')).catch(()=>toast('Bid not sent, check your connection'))};
setInterval(()=>{const e=$('#jt');if(e&&PUB&&PUB.l)e.textContent=Math.max(0,Math.ceil(PUB.l-(performance.now()-PUB.at)/1000))+'s'},250);
V.join=()=>{const tb=topbar(`<button class=tb onclick="G={screen:'home',saved:G.saved};PUB=null;ME=null;R()">${ic('home')}<span>Leave</span></button>`);
 if(NET===false)return tb+`<div class=ctl><div class=box><h3>Online needs the hosted link</h3><p class=muted>Open the game from its web address (not a downloaded file), then tap Join.</p></div></div>`;
 if(!PUB)return tb+`<div class=ctl><div class=box style="display:grid;gap:14px"><h3>${ic('phone')} Join a game</h3><p class=muted style="margin:0">Type the 4-letter room code shown on the host's screen.</p><input class=codein id=jc maxlength=4 placeholder="CODE" value="${esc(CODE)}" autocapitalize=characters autocomplete=off onkeydown="if(event.key=='Enter')joinTry()"><button class="btn primary big wide" onclick="joinTry()">Join</button>${JOINAT?`<p class=muted style="text-align:center;margin:0">${Date.now()-JOINAT>6000?'No reply yet. Check that the host turned on <b>Online</b> and the code matches.':'Looking for room '+esc(CODE)+'…'}</p>`:''}</div></div>`;
 const P=PUB;if(ME==null||ME>=P.n.length)return tb+`<div class=ctl><div class=box style="display:grid;gap:12px"><h3>Who are you?</h3><div class=ptiles>${P.n.map((n,i)=>`<button class=ptile style="--pc:${pcol(i)}" onclick="pickSeat(${i})">${av(i,0,P.n)}<span class=tx><b>${esc(n)}</b><small>${seat(i)}</small></span></button>`).join('')}</div></div></div>`;
 const m=ME,me=`<div class=mebar style="--pc:${pcol(m)}">${av(m,1,P.n)}<b>${esc(P.n[m])}</b>${P.co?`<span class=bal>${coin()}${P.co[m]}</span>`:''}</div>`;let body='';
 if(P.sc=='setup')body=`<div class=box><h3>You're in!</h3><p class=muted style="margin:0">Waiting for the host to start the game…</p></div>`;
 else if(P.sc=='end')body=`<div class=box><h3>Round over</h3><p class=muted style="margin:0">Look at the host screen to rank the teams.</p></div>`;
 else if(P.st=='pick')body=P.t==m?`<div class=box style="display:grid;gap:10px;text-align:center"><h3 style="justify-content:center">Your pick!</h3><p class=muted style="margin:0">Tap one mystery card.</p><div class=backs style="padding:10px 0">${Array.from({length:P.v},(_,k)=>`<button class=cback onclick="NET.emit('pick',{c:CODE,p:ME,k:${k}})">${backSVG(DECK)}<span class=qm>?</span></button>`).join('')}</div></div>`:`<div class=box><h3>${esc(P.n[P.t])} is picking…</h3><p class=muted style="margin:0">Get ready to bid.</p></div>`;
 else if(P.st=='bid'&&P.cd>=0&&P.b&&DB[P.cd]){const b=P.b,cid=P.cd,lead=b.p===m,mx=P.mx[m],ok=P.ok[m];
  body=`<div class=jcard>${card(cid,{keep:1,bounty:b.a})}<p class=muted style="margin:0;max-width:40ch">${esc(desc(cid))}</p></div>
  <div class=leadbox style="--pc:${pcol(b.p)}">${av(b.p,1,P.n)}<div class=who><small>${lead?'You are leading!':'Highest bid'}</small><b>${esc(P.n[b.p])}</b></div><div class=amt>${coin()}${b.a}</div></div>
  ${P.l?`<div class=tm><div class=tmb><i style="width:100%"></i></div><b id=jt>${P.l}s</b></div>`:''}
  ${b.au?`<p class=muted style="text-align:center">Default award. The host will confirm.</p>`:`<div class=jbid><button class="btn gold big" ${!ok||lead||b.a+1>mx?'disabled':''} onclick="jbid(${b.a+1})">${lead?'You lead':'Bid '+(b.a+1)}</button><div class=row2>${[2,5].map(n=>`<button class="btn big" style="font-size:22px" ${!ok||lead||b.a+n>mx?'disabled':''} onclick="jbid(${b.a+n})">+${n} → ${b.a+n}</button>`).join('')}</div><p class=muted style="text-align:center;margin:0;font-size:13px">${ok?`You can bid up to ${mx}`:'You can\'t bid on this card'}</p></div>`}`}
 else body=`<div class=box><h3>Waiting for the host…</h3></div>`;
 return tb+`<div class=ctl>${me}${body}<button class=link onclick="ME=null;R()">Not me? Change seat</button></div>`};

/* ---------------- sound panel ---------------- */
function sndIcon(){const b=$('#sndb');if(b)b.innerHTML=ic(MU.on||SX.on?'vol':'mute')+'<span>Sound</span>'}
function sndOpen(e){e&&e.stopPropagation();let p=$('#sndp');if(p){p.remove();return}p=document.createElement('div');p.id='sndp';p.setAttribute('role','dialog');p.setAttribute('aria-label','Sound');
 const draw=()=>{p.innerHTML=`<div class=srow><b>Music</b><button class="sw ${MU.on?'on':''}" aria-pressed="${MU.on}" aria-label="Music on or off" id=swm></button><input type=range min=0 max=1 step=.05 value="${MU.vol}" aria-label="Music volume" id=rvm></div>
  <div class=srow><b>Sound effects</b><button class="sw ${SX.on?'on':''}" aria-pressed="${SX.on}" aria-label="Sound effects on or off" id=sws></button><input type=range min=0 max=1 step=.05 value="${SX.vol}" aria-label="Effects volume" id=rvs></div>
  <small class=muted>Every universe has its own theme music.</small>`;
  p.querySelector('#swm').onclick=()=>{if(MU.on){MU.stop();LS.set('mdb-music',false)}else{MU.ctx(ctxDeck());MU.start();LS.set('mdb-music',true)}draw();sndIcon()};
  p.querySelector('#sws').onclick=()=>{SX.toggle();draw();sndIcon();SX.play('coin')};
  p.querySelector('#rvm').oninput=ev=>{MU.setVol(+ev.target.value);if(!MU.on){MU.ctx(ctxDeck());MU.start();LS.set('mdb-music',true);draw()}};
  p.querySelector('#rvs').onchange=ev=>{SX.setVol(+ev.target.value);SX.play('coin')}};
 draw();document.body.appendChild(p);const r=$('#sndb').getBoundingClientRect();p.style.top=(r.bottom+8)+'px';p.style.right=Math.max(12,innerWidth-r.right)+'px'}
document.addEventListener('click',e=>{const p=$('#sndp');if(p&&!p.contains(e.target)&&!e.target.closest('#sndb'))p.remove()});
document.addEventListener('keydown',e=>{if(e.key=='Escape'){const p=$('#sndp');if(p)p.remove();if(G.menu||G.pv||G.lb||G.cb){G.menu=G.pv=G.lb=G.cb=0;R()}}});

/* ---------------- navigation ---------------- */
function goHome(){if(G.screen=='game'||G.screen=='end'){if(!confirm('Leave this game? You can continue it later from the home screen.'))return;G={screen:'home',saved:{...G,menu:0,pv:0,lb:0,cb:0}}}else G={screen:'home',saved:G.saved||null};R();scrollTo(0,0)}
function resume(){const s=G.saved;if(!s)return;G=s;G.saved=null;setDeck(G.deck,G.customRaw);R();if(G.online)netHost()}

/* ---------------- boot ---------------- */
R();
if(REJOIN)netJoin().then(()=>{CODE=REJOIN.c;ME=REJOIN.me!=null?REJOIN.me:null;G={screen:'join',saved:G.saved||null};R();NET&&NET.room(CODE).then(()=>NET.emit('hello',{c:CODE,p:ME})).catch(()=>{})});
</script></body></html>
